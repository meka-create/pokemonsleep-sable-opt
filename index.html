<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ミュウツーサブレ最適化ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const globalDpMemo = new Map();

    const InputRow = React.memo(({ id, label, hasInfinity, value, onChange, max }) => {
      const isInf = value === '∞';
      const handleUp = () => {
        if (isInf) return;
        const curr = value === '' ? 0 : parseInt(value, 10);
        if (max !== undefined && curr >= max) return;
        onChange(id, curr + 1);
      };
      const handleDown = () => {
        if (isInf) return;
        const curr = value === '' ? 0 : parseInt(value, 10);
        onChange(id, Math.max(0, curr - 1));
      };
      const isDownDisabled = isInf || (value === '' ? 0 : parseInt(value, 10)) <= 0;
      const isUpDisabled = isInf || (max !== undefined && (value === '' ? 0 : parseInt(value, 10)) >= max);

      return (
        <div className="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
          <span className="text-sm font-medium text-gray-700">{label}</span>
          <div className="flex gap-2 items-center">
            <div className="w-8 flex justify-center">
              {hasInfinity && (
                <button 
                  onClick={() => onChange(id, isInf ? '0' : '∞')} 
                  className="px-2 py-1 bg-purple-100 text-purple-700 rounded text-xs font-bold active:bg-purple-200 hover:bg-purple-200 transition-colors"
                >
                  ∞
                </button>
              )}
            </div>
            <div className="flex gap-1 items-center">
              <button onClick={handleDown} disabled={isDownDisabled} className={`w-8 h-8 flex items-center justify-center rounded font-bold text-lg transition-colors ${isDownDisabled ? 'bg-gray-100 text-gray-300' : 'bg-gray-200 text-gray-700 active:bg-gray-300'}`}>−</button>
              <input type={isInf ? "text" : "number"} inputMode={isInf ? "text" : "numeric"} min="0" max={max} value={value} readOnly={isInf} onChange={(e) => onChange(id, e.target.value)} className="w-12 p-1 border border-gray-300 rounded text-center font-bold text-gray-700 focus:ring-2 focus:ring-purple-400 outline-none bg-white" />
              <button onClick={handleUp} disabled={isUpDisabled} className={`w-8 h-8 flex items-center justify-center rounded font-bold text-lg transition-colors ${isUpDisabled ? 'bg-gray-100 text-gray-300' : 'bg-gray-200 text-gray-700 active:bg-gray-300'}`}>＋</button>
            </div>
          </div>
        </div>
      );
    });

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
      });
      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) { console.error(error); }
      };
      return [storedValue, setValue];
    }

    const App = () => {
      const [inventory, setInventory] = useLocalStorage('mewtwo_inventory', { s6: 10, s5: 10, s4: 1, s3: 0, s1: '∞', encounters: 14 });
      const [formData, setFormData] = useState(inventory);
      const [gauge, setGauge] = useLocalStorage('mewtwo_gauge', 0);
      const [isChance, setIsChance] = useLocalStorage('mewtwo_isChance', false);
      const [fedCount, setFedCount] = useLocalStorage('mewtwo_fedCount', 0);
      const [guaranteedCount, setGuaranteedCount] = useLocalStorage('mewtwo_guaranteedCount', 3);
      const [isFull, setIsFull] = useLocalStorage('mewtwo_isFull', false);
      const [history, setHistory] = useLocalStorage('mewtwo_history', []);
      const [isPremium, setIsPremium] = useLocalStorage('mewtwo_isPremium', true);

      const [engineState, setEngineState] = useState({
        isCalculating: false,
        bestMove: { type: '計算中...', id: null, prob: 0 },
        expectedTotal: "計算中...",
        routeData: { route: [], finalG: 0 }
      });

      const actualGauge = gauge === '' ? 0 : gauge;

      const handleFormChange = useCallback((id, value) => {
        if (value === '∞') { setFormData(prev => ({ ...prev, [id]: '∞' })); return; }
        if (value === '') { setFormData(prev => ({ ...prev, [id]: '' })); return; }
        let strVal = value.toString().replace(/^0+(?=\d)/, '');
        let parsed = parseInt(strVal, 10);
        if (isNaN(parsed) || parsed < 0) parsed = 0;
        if (id === 's4' && parsed > 1) { parsed = 1; strVal = '1'; }
        setFormData(prev => ({ ...prev, [id]: strVal === '' ? '' : parsed }));
      }, []);

      const applySettings = () => {
        const cleanedData = { ...formData };
        ['s6', 's5', 's4', 's3', 's1', 'encounters'].forEach(key => {
          if (cleanedData[key] === '') cleanedData[key] = 0;
        });
        setInventory(cleanedData);
        setFormData(cleanedData);
        globalDpMemo.clear(); 
      };

      const isModified = JSON.stringify(inventory) !== JSON.stringify(formData);

      // =========================================================================
      // 高速・安全な期待値計算エンジン (無限ループ・フリーズ防止ガード付き)
      // =========================================================================
      const getBestAction = useCallback((g, f, chance, inv, enc, guar, premium) => {
        
        const calcDP = (cg, cf, cChance, cInv, cEnc) => {
          if (cEnc <= 0) return { ev: 0, catchProb: 0, action: null };
          if (cg >= 30) {
            let nextInvDay = { ...cInv, s4: 1 }; 
            let evNext = 0;
            if (cEnc > 1) {
              evNext = 0.1 * calcDP(0, 0, true, nextInvDay, cEnc - 1).ev + 0.9 * calcDP(0, 0, false, nextInvDay, cEnc - 1).ev;
            }
            return { ev: 1.0 + evNext, catchProb: 1.0, action: null };
          }
          if (cf >= 10) { 
            let nextInvDay = { ...cInv, s4: 1 };
            let evNext = 0;
            if (cEnc > 1) {
              evNext = 0.1 * calcDP(cg, 0, true, nextInvDay, cEnc - 1).ev + 0.9 * calcDP(cg, 0, false, nextInvDay, cEnc - 1).ev;
            }
            return { ev: evNext, catchProb: 0, action: { id: 'pass', name: '➔ 翌日へ (ストップ)', val: 0 } };
          }

          const cap = (val) => val === '∞' ? 'inf' : Math.min(val, cEnc + 2);
          const memoKey = `${cg}-${cf}-${cChance}-${cap(cInv.s6)}-${cap(cInv.s5)}-${cInv.s4}-${cap(cInv.s3)}-${cap(cInv.s1)}-${cEnc}-${guar}-${premium}`;

          if (globalDpMemo.has(memoKey)) return globalDpMemo.get(memoKey);
          if (globalDpMemo.size > 20000) globalDpMemo.clear(); // 安全なメモリ制限

          let nextInvDay = { ...cInv, s4: 1 };
          let passEv = 0;
          if (cEnc > 1) {
            passEv = 0.1 * calcDP(cg, 0, true, nextInvDay, cEnc - 1).ev + 0.9 * calcDP(cg, 0, false, nextInvDay, cEnc - 1).ev;
          }

          let bestEv = passEv;
          let bestAct = { id: 'pass', name: '➔ 翌日へ (ストップ)', val: 0 };
          let bestCatchProb = 0;

          const sables = [
            { id: 's4', val: premium ? 4 : 3, name: premium ? 'ボーナス+(4)' : 'ボーナス(3)', priority: 5 },
            { id: 's1', val: 1, name: 'ポケ(1)', priority: 4 },
            { id: 's3', val: 3, name: 'スーパー(3)', priority: 3 },
            { id: 's5', val: 5, name: 'ハイパー(5)', priority: 2 },
            { id: 's6', val: 6, name: 'ミュウツー(6)', priority: 1 }
          ];

          const eatProb = (cf >= guar) ? 0.6 : 1.0;
          const rejectProb = 1.0 - eatProb;

          for (const sable of sables) {
            if (cInv[sable.id] !== '∞' && cInv[sable.id] <= 0) continue;

            let nextInvEat = { ...cInv };
            if (nextInvEat[sable.id] !== '∞') nextInvEat[sable.id]--;

            const evalEatState = (newG) => {
              if (newG >= 30) {
                let nextInvSuccess = { ...nextInvEat, s4: 1 };
                let evNext = 0;
                if (cEnc > 1) {
                  evNext = 0.1 * calcDP(0, 0, true, nextInvSuccess, cEnc - 1).ev + 0.9 * calcDP(0, 0, false, nextInvSuccess, cEnc - 1).ev;
                }
                return 1.0 + evNext;
              }
              return calcDP(newG, cf + 1, false, nextInvEat, cEnc).ev;
            };

            const evalEatProb = (newG) => {
              if (newG >= 30) return 1.0;
              return calcDP(newG, cf + 1, false, nextInvEat, cEnc).catchProb;
            };

            let evEat = 0, probEat = 0;
            if (cChance && cf === 0) {
              evEat = 0.1 * evalEatState(30) + 0.9 * evalEatState(cg + sable.val * 3);
              probEat = 0.1 * 1.0 + 0.9 * evalEatProb(cg + sable.val * 3);
            } else {
              evEat = 0.02 * evalEatState(30) + 0.08 * evalEatState(cg + sable.val * 3) + 0.90 * evalEatState(cg + sable.val);
              probEat = 0.02 * 1.0 + 0.08 * evalEatProb(cg + sable.val * 3) + 0.90 * evalEatProb(cg + sable.val);
            }

            let expectedValue = eatProb * evEat + rejectProb * passEv;
            let currentCatchProb = eatProb * probEat;

            if (expectedValue > bestEv + 1e-7) {
              bestEv = expectedValue;
              bestAct = sable;
              bestCatchProb = currentCatchProb;
            } else if (Math.abs(expectedValue - bestEv) <= 1e-7) {
              let currentPriority = bestAct.id === 'pass' ? 6 : bestAct.priority;
              if (sable.priority > currentPriority) {
                bestEv = expectedValue;
                bestAct = sable;
                bestCatchProb = currentCatchProb;
              }
            }
          }

          const res = { ev: bestEv, catchProb: bestCatchProb, action: bestAct };
          globalDpMemo.set(memoKey, res);
          return res;
        };

        return calcDP(g, f, chance, inv, enc);
      }, []);

      useEffect(() => {
        let isCancelled = false;
        
        if (actualGauge >= 30 || inventory.encounters <= 0) {
          setEngineState({
            isCalculating: false,
            bestMove: { type: '完了', id: null, prob: 1.0 },
            expectedTotal: "0.00",
            routeData: { route: [], finalG: actualGauge }
          });
          return;
        }

        setEngineState(prev => ({ ...prev, isCalculating: true, bestMove: { type: '計算中...', id: null, prob: 0 } }));

        // 同期処理として一瞬で計算（フリーズしない軽量設計）
        try {
          const res = getBestAction(actualGauge, fedCount, isChance, inventory, inventory.encounters, guaranteedCount, isPremium);
          if (isCancelled) return;

          const route = [];
          let currG = actualGauge;
          let currF = fedCount;
          let currChance = isChance;
          let currInv = { ...inventory };
          
          while (currG < 30 && currF < 10) {
            const stepRes = getBestAction(currG, currF, currChance, currInv, inventory.encounters, guaranteedCount, isPremium);
            if (!stepRes || !stepRes.action || stepRes.action.id === 'pass') break;
            
            route.push(stepRes.action.name);
            let val = stepRes.action.val;
            let multiplier = currChance ? 3 : 1;
            currG += val * multiplier;
            currF++;
            currChance = false;
            if (currInv[stepRes.action.id] !== '∞') currInv[stepRes.action.id]--;
          }

          setEngineState({
            isCalculating: false,
            bestMove: res.action ? { type: res.action.name, id: res.action.id, prob: res.catchProb } : { type: '➔ 翌日へ (ストップ)', id: 'pass', prob: 0 },
            expectedTotal: res.ev.toFixed(2), 
            routeData: { route, finalG: currG }
          });
        } catch (e) {
          console.error(e);
          setEngineState({
            isCalculating: false,
            bestMove: { type: 'エラー', id: null, prob: 0 },
            expectedTotal: "0.00",
            routeData: { route: [], finalG: actualGauge }
          });
        }

        return () => { isCancelled = true; };
      }, [actualGauge, fedCount, isChance, inventory, guaranteedCount, isPremium, getBestAction]);

      const handleThrow = (multiplier) => {
        const actId = engineState.bestMove.id;
        if (!actId || actId === 'pass' || engineState.isCalculating) return;

        setHistory(prev => [...prev, { gauge, fedCount, isChance, isFull, inventory: { ...inventory }, formData: { ...formData } }]);

        if (multiplier === 0) { setIsFull(true); return; }

        let actualMultiplier = multiplier;
        if (isChance && multiplier === 1) actualMultiplier = 3;

        let val = actId === 's6' ? 6 : actId === 's5' ? 5 : actId === 's4' ? (isPremium ? 4 : 3) : actId === 's3' ? 3 : 1;
        let added = actualMultiplier === 30 ? 30 : val * actualMultiplier;

        if (inventory[actId] !== '∞') {
          const nextCount = Math.max(0, inventory[actId] - 1);
          setInventory(prev => ({ ...prev, [actId]: nextCount }));
          setFormData(prev => ({ ...prev, [actId]: nextCount }));
        }

        setGauge(Math.min(30, actualGauge + added));
        setFedCount(fedCount + 1);
        setIsChance(false);
      };

      const undoMove = () => {
        if (history.length === 0) return;
        const last = history[history.length - 1];
        setGauge(last.gauge);
        setFedCount(last.fedCount);
        setIsChance(last.isChance);
        setIsFull(last.isFull || false); 
        setInventory(last.inventory);
        setFormData(last.formData);
        setHistory(prev => prev.slice(0, -1));
      };

      const resetGaugeOnly = () => {
        if (window.confirm("フレンドポイントと食べた枚数を0にリセットしますか？")) {
          setGauge(0); setFedCount(0); setIsChance(false); setIsFull(false); setHistory([]);
        }
      };

      const resetEncounter = () => {
        if (actualGauge >= 30) setGauge(0);
        setFedCount(0); setIsChance(false); setIsFull(false); setHistory([]);
        setInventory(prev => {
          const next = { ...prev };
          const curr = next.encounters === '' ? 0 : parseInt(next.encounters, 10);
          if (curr > 0) next.encounters = curr - 1;
          next.s4 = 1; 
          return next;
        });
        setFormData(prev => {
          const next = { ...prev };
          const curr = next.encounters === '' ? 0 : parseInt(next.encounters, 10);
          if (curr > 0) next.encounters = curr - 1;
          next.s4 = 1; 
          return next;
        });
      };

      return (
        <div className="min-h-screen max-w-md mx-auto bg-gray-200 flex flex-col pb-10">
          <header className="bg-white px-4 pt-8 pb-3 shadow-sm sticky top-0 z-10">
            <h1 className="text-lg font-black text-purple-900 tracking-tight flex items-center gap-2">
              <span className="bg-purple-600 text-white px-2 py-1 rounded text-xs">Opt</span>ミュウツーサブレ
            </h1>
          </header>

          <main className="flex-1 overflow-y-auto p-4 space-y-4">
            <div className="bg-white rounded-2xl shadow-sm p-5 border-t-4 border-purple-600">
              <h2 className="text-sm font-bold text-gray-500 mb-4">実践シミュレーター</h2>
              <div className="flex items-center justify-between mb-2">
                <span className="text-sm text-gray-600 font-bold">フレンドポイント</span>
                <div className="flex items-center gap-2">
                  <button onClick={resetGaugeOnly} className="text-xs bg-gray-200 px-2 py-1 rounded font-bold text-gray-600 active:bg-gray-300 hover:bg-gray-300 transition-colors">リセット</button>
                  <div className="flex items-baseline">
                    <input type="number" inputMode="numeric" min="0" max="30" value={gauge} onChange={(e) => {
                        const val = e.target.value;
                        if (val === '') { setGauge(''); setHistory([]); setIsFull(false); return; }
                        let strVal = val.replace(/^0+(?=\d)/, '');
                        let parsed = parseInt(strVal, 10);
                        if (isNaN(parsed) || parsed < 0) parsed = 0;
                        if (parsed > 30) parsed = 30;
                        setGauge(parsed); setHistory([]); setIsFull(false);
                      }} className="w-12 p-0 text-right font-black text-purple-700 text-2xl bg-transparent border-b-2 border-dashed border-purple-400 focus:border-solid focus:border-purple-600 focus:outline-none transition-colors" />
                    <span className="text-2xl font-black text-purple-700 ml-1">/ 30</span>
                  </div>
                </div>
              </div>
              
              <div className="w-full bg-gray-200 rounded-full h-3 mb-5 overflow-hidden">
                <div className="bg-purple-600 h-3 rounded-full transition-all duration-500 ease-out" style={{ width: `${(Math.min(30, actualGauge) / 30) * 100}%` }}></div>
              </div>

              <div className="flex gap-4 mb-4 bg-purple-50 p-3 rounded-xl border border-purple-100">
                <label className={`flex items-center space-x-2 text-sm font-bold w-full cursor-pointer ${fedCount > 0 || actualGauge >= 30 || isFull || engineState.isCalculating ? 'text-gray-400 opacity-70' : 'text-purple-900'}`}>
                  <input type="checkbox" checked={isChance} onChange={(e) => setIsChance(e.target.checked)} className="rounded w-5 h-5 text-purple-600 focus:ring-purple-500 border-gray-300" disabled={fedCount > 0 || actualGauge >= 30 || isFull || engineState.isCalculating} />
                  <span>チャンス状態 (1投目のみ)</span>
                </label>
              </div>

              <div className="flex justify-between items-center mb-1 text-sm font-medium text-gray-700">
                <span>確定ライン:</span>
                <select value={guaranteedCount} onChange={(e) => setGuaranteedCount(Number(e.target.value))} className="border-gray-300 rounded shadow-sm focus:ring-purple-500 p-1 bg-gray-50" disabled={isFull || engineState.isCalculating}>
                  <option value={3}>3枚 (通常)</option>
                  <option value={2}>2枚</option>
                </select>
              </div>
              <p className="text-xs text-gray-400 text-right mb-4">現在 {fedCount + 1} 枚目（{fedCount >= guaranteedCount ? '⚠️満腹リスクあり' : '✅確定ライン'}）</p>

              <div className="bg-gradient-to-b from-purple-50 to-white rounded-2xl shadow-inner p-5 text-center border border-gray-100 relative">
                <p className="text-xs text-gray-500 font-bold mb-1">次の一手</p>
                <p className={`text-3xl font-black text-purple-900 mb-3 transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                  {isFull ? '満腹 (逃走)' : engineState.bestMove.type}
                </p>
                
                {!isFull && engineState.bestMove.type !== '完了' && engineState.bestMove.id !== 'pass' && (
                  <div className={`mb-4 bg-white bg-opacity-80 rounded-lg p-3 text-sm text-gray-700 shadow-sm border border-purple-100 text-left w-full transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                    <div className="flex justify-between border-b border-gray-100 pb-2 mb-2">
                      <span className="font-bold text-gray-600">この回の捕獲確率:</span>
                      <span className="font-black text-purple-700">{(engineState.bestMove.prob * 100).toFixed(1)}%</span>
                    </div>
                    <div>
                      <span className="font-bold text-gray-600 block mb-2 text-xs">想定ルート (大成功・満腹なし進行時):</span>
                      <div className="text-xs text-gray-600 flex flex-wrap gap-1 items-center">
                        {engineState.routeData.route.map((step, idx) => (
                          <React.Fragment key={idx}>
                            <span className="bg-purple-100 text-purple-800 px-2 py-1 rounded font-medium">{step}</span>
                            {idx < engineState.routeData.route.length - 1 && <span className="text-gray-400">➔</span>}
                          </React.Fragment>
                        ))}
                        {engineState.routeData.finalG >= 30 ? (
                          <span className="text-green-600 font-bold ml-1">GET!</span>
                        ) : (
                          <span className="text-gray-500 font-bold ml-1 text-xs">➔ 翌日へ</span>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {!isFull && engineState.bestMove.type !== '完了' && engineState.bestMove.id !== 'pass' && (
                  <>
                    <p className="text-xs text-gray-400 mb-2">実際の結果をタップ（所持数は自動で減ります）</p>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <button onClick={() => handleThrow(1)} disabled={engineState.isCalculating} className={`bg-white border border-purple-200 text-purple-700 py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-purple-100 active:scale-95'}`}>通常</button>
                      <button onClick={() => handleThrow(3)} disabled={engineState.isCalculating} className={`bg-purple-600 text-white py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-purple-700 active:scale-95'}`}>大成功 (3倍)</button>
                      <button onClick={() => handleThrow(30)} disabled={engineState.isCalculating} className={`bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:opacity-80 active:scale-95'}`}>超成功 (一発)</button>
                      <button onClick={() => handleThrow(0)} disabled={engineState.isCalculating} className={`bg-gray-400 text-white py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-gray-500 active:scale-95'}`}>満腹 (逃走)</button>
                    </div>
                  </>
                )}

                {isFull && (
                  <div className="mb-4 bg-gray-100 rounded-lg p-4 text-sm text-gray-700 shadow-sm border border-gray-200 text-center fade-in">
                    <p className="font-black text-gray-600 mb-1 text-lg">満腹になりました</p>
                    <p className="text-xs text-gray-500 font-bold">今日の判定はここで終了です。<br/>「次の出会いへ進む」を押してください。</p>
                  </div>
                )}

                {!isFull && engineState.bestMove.id === 'pass' && (
                  <div className={`mb-4 bg-purple-50 rounded-lg p-4 text-sm text-purple-900 shadow-sm border border-purple-200 text-center transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                    <p className="font-black mb-1 text-lg">今日はここでストップ！</p>
                    <p className="text-xs font-bold">無理をして投げるより、翌日に回す方がお得です。<br/>「次の出会いへ進む」を押してください。</p>
                  </div>
                )}
                
                {history.length > 0 && (
                  <button onClick={undoMove} disabled={engineState.isCalculating} className={`w-full mt-2 py-3 bg-gray-200 text-gray-700 font-bold text-sm rounded-xl transition-all flex items-center justify-center gap-1 ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-gray-300 hover:bg-gray-300'}`}>
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                    1手戻る (誤タップ修正)
                  </button>
                )}
              </div>
              <button onClick={resetEncounter} disabled={engineState.isCalculating} className={`w-full mt-4 py-4 bg-purple-100 text-purple-700 font-black text-sm rounded-xl shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-purple-200 hover:bg-purple-200'}`}>次の出会いへ進む (残り回数-1)</button>
            </div>

            <div className="bg-white rounded-2xl shadow-sm p-5 flex items-center justify-between">
              <div>
                <h2 className="text-sm font-bold text-gray-800">イベント完走予測</h2>
                <p className="text-xs text-gray-400">適用中の在庫・回数による期待値</p>
              </div>
              <div className={`text-right transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                <span className="text-2xl font-black text-purple-700">{engineState.expectedTotal}</span>
                <span className="text-sm text-gray-500 ml-1">体</span>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-sm p-5 pb-8 relative">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-sm font-bold text-gray-800">サブレ所持数・設定</h2>
                <label className="flex items-center cursor-pointer">
                  <div className="relative">
                    <input type="checkbox" className="sr-only" checked={isPremium} onChange={(e) => { setIsPremium(e.target.checked); globalDpMemo.clear(); }} disabled={engineState.isCalculating} />
                    <div className={`block w-10 h-6 rounded-full transition-colors ${isPremium ? 'bg-purple-500' : 'bg-gray-300'}`}></div>
                    <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${isPremium ? 'transform translate-x-4' : ''}`}></div>
                  </div>
                  <span className={`ml-2 text-xs font-bold ${isPremium ? 'text-purple-700' : 'text-gray-500'}`}>プレパス</span>
                </label>
              </div>

              <div className="space-y-3">
                <InputRow id="s6" label="ミュウツーサブレ (6)" hasInfinity={false} value={formData.s6} onChange={handleFormChange} />
                <InputRow id="s5" label="ハイパーサブレ (5)" hasInfinity={false} value={formData.s5} onChange={handleFormChange} />
                <InputRow id="s4" label={isPremium ? "ボーナスサブレ+ (4)" : "ボーナスサブレ (3)"} hasInfinity={false} value={formData.s4} onChange={handleFormChange} max={1} />
                <InputRow id="s3" label="スーパーサブレ (3)" hasInfinity={true} value={formData.s3} onChange={handleFormChange} />
                <InputRow id="s1" label="ポケサブレ (1)" hasInfinity={true} value={formData.s1} onChange={handleFormChange} />
                <InputRow id="encounters" label="残り出会い回数" hasInfinity={false} value={formData.encounters} onChange={handleFormChange} />
              </div>

              {isModified && (
                <div className="mt-5 fade-in">
                  <button onClick={applySettings} disabled={engineState.isCalculating} className={`w-full bg-purple-600 text-white py-3 rounded-xl font-bold shadow-md transition-all text-lg ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'hover:bg-purple-700 active:scale-95'}`}>
                    設定を適用して再計算
                  </button>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
