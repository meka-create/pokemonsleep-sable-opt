<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ミュウツーサブレ最適化ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    /* スクロールバー非表示 */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          return initialValue;
        }
      });
      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {
          console.error(error);
        }
      };
      return [storedValue, setValue];
    }

    const App = () => {
      // --- State ---
      const [inventory, setInventory] = useLocalStorage('mewtwo_inventory', {
        s6: 10, s5: 10, s4: 1, s3: 0, s1: '∞'
      });
      const [gauge, setGauge] = useState(0);
      const [isChance, setIsChance] = useState(false);
      const [fedCount, setFedCount] = useState(0);
      const [guaranteedCount, setGuaranteedCount] = useState(3);

      // --- インベントリ更新ハンドラ ---
      const handleInvChange = (id, value) => {
        let parsed = value;
        if (value !== '∞') {
          parsed = parseInt(String(value).replace(/[^0-9]/g, ''), 10);
          if (isNaN(parsed) || parsed < 0) parsed = 0;
        }
        setInventory(prev => ({ ...prev, [id]: parsed }));
      };

      // --- 動的計画法（DP）による真の期待値計算エンジン ---
      const bestMove = useMemo(() => {
        const remaining = 30 - gauge;
        if (remaining <= 0) return { type: '完了', message: '捕獲完了です！お疲れ様でした。' };

        // サブレの相対的価値（節約優先度）
        const costs = { s6: 200, s5: 80, s4: 0, s3: 40, s1: 10 };
        const sables = [
          { id: 's6', val: 6, name: 'ミュウツー(6)' },
          { id: 's5', val: 5, name: 'ハイパー(5)' },
          { id: 's4', val: 4, name: 'ボーナス(4)' },
          { id: 's3', val: 3, name: 'スーパー(3)' },
          { id: 's1', val: 1, name: 'ポケ(1)' }
        ];

        const CATCH_REWARD = 10000;
        const GAUGE_VALUE = 20; // 捕獲できなくてもゲージを進める価値
        const memo = {};

        // 状態(g: 現在ゲージ, f: 食べた枚数, chance: チャンス状態, inv: 残りサブレ)の期待値を計算
        const calcDP = (g, f, chance, inv) => {
          if (g >= 30) return { ev: CATCH_REWARD, action: null };
          if (f >= 6) return { ev: g * GAUGE_VALUE, action: null }; // 深さ制限(現実的に6枚目以降はほぼ満腹)

          const memoKey = `${g}-${f}-${chance}-${inv.s6}-${inv.s5}-${inv.s4}-${inv.s3}-${inv.s1}`;
          if (memo[memoKey]) return memo[memoKey];

          let bestVal = -Infinity;
          let bestAction = null;

          // 満腹リスクの計算（このターン投げた「後」に満腹になる確率）
          const fullRiskRate = (f + 1 >= guaranteedCount) ? 0.4 : 0.0;
          const eatNextRate = 1.0 - fullRiskRate;

          for (const sable of sables) {
            const count = inv[sable.id];
            if (count !== '∞' && count <= 0) continue;

            const nextInv = { ...inv };
            if (nextInv[sable.id] !== '∞') nextInv[sable.id] -= 1;
            
            const cost = costs[sable.id];
            let expectedValue = 0;

            // 結果を評価するヘルパー（投げた後の状態をシミュレーション）
            const evaluateOutcome = (nextG) => {
              if (nextG >= 30) return CATCH_REWARD; // 捕獲
              // 次のターンへ進む。満腹になる確率(0.4)と、食べ続けて次も投げられる確率(0.6)の期待値を合成
              const nextStateEv = calcDP(nextG, f + 1, false, nextInv).ev;
              return (eatNextRate * nextStateEv) + (fullRiskRate * (nextG * GAUGE_VALUE));
            };

            if (chance) {
              // チャンス: 90%で大成功(3倍), 10%で超成功(MAX)
              const valBig = Math.min(30, g + sable.val * 3);
              const evBig = evaluateOutcome(valBig);
              const evMega = CATCH_REWARD;
              expectedValue = (0.9 * evBig) + (0.1 * evMega) - cost;
            } else {
              // 通常: 90%等倍, 8%大成功(3倍), 2%超成功(MAX)
              const valNorm = Math.min(30, g + sable.val);
              const valBig = Math.min(30, g + sable.val * 3);
              const evNorm = evaluateOutcome(valNorm);
              const evBig = evaluateOutcome(valBig);
              const evMega = CATCH_REWARD;
              expectedValue = (0.9 * evNorm) + (0.08 * evBig) + (0.02 * evMega) - cost;
            }

            if (expectedValue > bestVal) {
              bestVal = expectedValue;
              bestAction = sable.name;
            }
          }

          const result = { ev: bestVal, action: bestAction };
          memo[memoKey] = result;
          return result;
        };

        const result = calcDP(gauge, fedCount, isChance, inventory);
        
        // 例外処理: サブレが一切ない場合
        if (!result.action) return { type: '在庫なし', message: '投げられるサブレがありません。' };
        return { type: result.action, message: `${result.action} を投げましょう。` };
      }, [gauge, fedCount, isChance, guaranteedCount, inventory]);

      // --- アクション ---
      const handleThrow = (multiplier) => {
        if (multiplier === 0) {
          alert("満腹になりました。今日の判定は終了です。");
          return;
        }
        let added = 0;
        if (bestMove.type.includes('6')) added = 6 * multiplier;
        else if (bestMove.type.includes('5')) added = 5 * multiplier;
        else if (bestMove.type.includes('4')) added = 4 * multiplier;
        else if (bestMove.type.includes('3')) added = 3 * multiplier;
        else if (bestMove.type.includes('1')) added = 1 * multiplier;
        if (multiplier === 30) added = 30;

        // インベントリの消費
        const usedId = bestMove.type.includes('6') ? 's6' : 
                       bestMove.type.includes('5') ? 's5' : 
                       bestMove.type.includes('4') ? 's4' : 
                       bestMove.type.includes('3') ? 's3' : 's1';
        
        if (inventory[usedId] !== '∞') {
          setInventory(prev => ({ ...prev, [usedId]: Math.max(0, prev[usedId] - 1) }));
        }

        setGauge(Math.min(30, gauge + added));
        setFedCount(fedCount + 1);
        setIsChance(false);
      };

      const resetEncounter = () => {
        setGauge(0);
        setFedCount(0);
        setIsChance(false);
      };

      // --- UI描画 ---
      const InputRow = ({ id, label, isS6 }) => (
        <div className="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
          <span className="text-sm font-medium text-gray-700">{label}</span>
          <div className="flex gap-2">
            <input 
              type="text" 
              inputMode={inventory[id] === '∞' ? 'text' : 'numeric'}
              value={inventory[id]} 
              onChange={(e) => handleInvChange(id, e.target.value)} 
              className="w-16 p-1 border border-gray-300 rounded text-center font-bold text-gray-700 focus:ring-2 focus:ring-purple-400 outline-none transition-all"
            />
            {!isS6 && (
              <button 
                onClick={() => handleInvChange(id, '∞')} 
                className="px-3 bg-purple-100 text-purple-700 rounded text-sm font-bold active:bg-purple-200 transition-colors"
              >
                ∞
              </button>
            )}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen max-w-md mx-auto bg-gray-200 flex flex-col">
          <header className="bg-white px-4 pt-8 pb-3 shadow-sm sticky top-0 z-10 flex justify-between items-end">
            <h1 className="text-lg font-black text-purple-900 tracking-tight flex items-center gap-2">
              <span className="bg-purple-600 text-white px-2 py-1 rounded text-xs">Opt</span>ミュウツーサブレ
            </h1>
          </header>

          <main className="flex-1 overflow-y-auto p-4 space-y-4 pb-10">
            {/* インベントリ領域 */}
            <div className="bg-white rounded-2xl shadow-sm p-4">
              <h2 className="text-sm font-bold text-gray-500 mb-3">サブレ所持数 (自動保存＆即時反映)</h2>
              <div className="space-y-2">
                <InputRow id="s6" label="ミュウツー (6)" isS6={true} />
                <InputRow id="s5" label="ハイパー (5)" isS6={false} />
                <InputRow id="s4" label="ボーナス+ (4)" isS6={false} />
                <InputRow id="s3" label="スーパー (3)" isS6={false} />
                <InputRow id="s1" label="ポケ (1)" isS6={false} />
              </div>
            </div>

            {/* シミュレーション領域 */}
            <div className="bg-white rounded-2xl shadow-sm p-5 border-t-4 border-purple-600">
              <div className="flex items-center justify-between mb-2">
                <span className="text-sm text-gray-600 font-bold">フレンドポイント</span>
                <span className="text-2xl font-black text-purple-700">{gauge} / 30</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-3 mb-5 overflow-hidden">
                <div className="bg-purple-600 h-3 rounded-full transition-all duration-500 ease-out" style={{ width: `${(gauge / 30) * 100}%` }}></div>
              </div>

              <div className="flex gap-4 mb-4 bg-purple-50 p-3 rounded-xl border border-purple-100">
                <label className="flex items-center space-x-2 text-sm font-bold text-purple-900 w-full cursor-pointer">
                  <input type="checkbox" checked={isChance} onChange={(e) => setIsChance(e.target.checked)} className="rounded w-5 h-5 text-purple-600 focus:ring-purple-500 border-gray-300" disabled={fedCount > 0} />
                  <span>チャンス状態 (1投目のみ)</span>
                </label>
              </div>

              <div className="flex justify-between items-center mb-1 text-sm font-medium text-gray-700">
                <span>確定ライン:</span>
                <select value={guaranteedCount} onChange={(e) => setGuaranteedCount(Number(e.target.value))} className="border-gray-300 rounded shadow-sm focus:ring-purple-500 p-1 bg-gray-50">
                  <option value={3}>3枚 (通常)</option>
                  <option value={2}>2枚</option>
                </select>
              </div>
              <p className="text-xs text-gray-400 text-right mb-4">現在 {fedCount} 枚目（{fedCount >= guaranteedCount ? '⚠️満腹リスクあり' : '✅確定ライン'}）</p>

              {/* 結果表示・操作パネル */}
              <div className="bg-gradient-to-b from-purple-50 to-white rounded-2xl shadow-inner p-5 text-center border border-gray-100">
                <p className="text-xs text-gray-500 font-bold mb-1">計算された最適解</p>
                <p className="text-3xl font-black text-purple-900 mb-5">{bestMove.type}</p>
                
                {bestMove.type !== '完了' && bestMove.type !== '在庫なし' && (
                  <>
                    <p className="text-xs text-gray-400 mb-2">実際の結果をタップ（所持数も自動で減ります）</p>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <button onClick={() => handleThrow(1)} className="bg-white border border-purple-200 text-purple-700 py-3 rounded-xl font-bold active:bg-purple-100 shadow-sm transition-transform active:scale-95">通常</button>
                      <button onClick={() => handleThrow(3)} className="bg-purple-600 text-white py-3 rounded-xl font-bold active:bg-purple-700 shadow-sm transition-transform active:scale-95">大成功 (3倍)</button>
                      <button onClick={() => handleThrow(30)} className="bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-3 rounded-xl font-bold active:opacity-80 shadow-sm transition-transform active:scale-95">超成功 (一発)</button>
                      <button onClick={() => handleThrow(0)} className="bg-gray-400 text-white py-3 rounded-xl font-bold active:bg-gray-500 shadow-sm transition-transform active:scale-95">満腹 (逃走)</button>
                    </div>
                  </>
                )}
              </div>
              <button onClick={resetEncounter} className="w-full mt-4 py-3 bg-gray-100 text-gray-600 font-bold text-sm rounded-xl active:bg-gray-200 transition-colors">次の出会いへリセット</button>
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
