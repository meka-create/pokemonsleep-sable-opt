<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ミュウツーサブレ最適化ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script id="solver-worker" type="javascript/worker">
    'use strict';

    self.onmessage = (event) => {
      const msg = event.data || {};
      if (msg.type !== 'solve') return;

      const startedAt = performance.now();
      try {
        const context = makeContext({
          premium: !!msg.premium,
          guaranteedCount: msg.guaranteedCount,
          maxEncounters: msg.state?.encounters,
          inventory: msg.state?.inventory || {}
        });
        const result = solve(context, msg.state || {});
        result.calcMs = performance.now() - startedAt;
        self.postMessage({ type: 'result', requestId: msg.requestId, result });
      } catch (error) {
        self.postMessage({
          type: 'error',
          requestId: msg.requestId,
          message: error && error.stack ? error.stack : String(error)
        });
      }
    };

    function makeContext(cfg) {
      const premium = !!cfg.premium;
      const guar = Math.max(1, Math.floor(Number(cfg.guaranteedCount) || 3));
      const maxEnc = Math.max(0, Math.floor(Number(cfg.maxEncounters) || 0));
      const values = { s6: 6, s5: 5, s4: premium ? 4 : 3, s3: 3, s1: 1 };
      const ids = ['s6', 's5', 's4', 's3', 's1'];
      const maxCounts = {};
      const isInf = {};

      for (const id of ids) {
        const raw = cfg.inventory?.[id];
        isInf[id] = raw === '∞';
        if (isInf[id]) {
          maxCounts[id] = 0;
          continue;
        }

        const n = Math.max(0, Math.floor(Number(raw) || 0));
        if (id === 's4') {
          // ボーナスサブレはUI上も1枚が上限で、次の出会いで1枚に戻る。
          maxCounts[id] = Math.min(n, 1);
        } else {
          // 厳密な上限。1回の捕獲までに、この種類だけを通常成功で投げ続けても
          // ceil(30 / value)枚で必ずゲージ30に到達する。
          // 捕獲できる回数は残り出会い回数を超えないため、これを超える在庫は
          // イベント中に物理的に消費できず、最適行動にも影響しない。
          const horizonCap = maxEnc * Math.ceil(30 / values[id]);
          maxCounts[id] = Math.min(n, horizonCap);
        }
      }

      const radix = {
        phase: guar + 1,
        s6: isInf.s6 ? 1 : maxCounts.s6 + 1,
        s5: isInf.s5 ? 1 : maxCounts.s5 + 1,
        s4: 2,
        s3: isInf.s3 ? 1 : maxCounts.s3 + 1,
        s1: isInf.s1 ? 1 : maxCounts.s1 + 1,
        enc: maxEnc + 1
      };

      // 通常の14回ケースではNumberの整数キーで安全に一意化できる。
      // 極端に大きいユーザー入力だけ文字列キーへ自動フォールバックする。
      let keySpace = 31 * radix.phase * 2;
      keySpace *= radix.s6 * radix.s5 * radix.s4 * radix.s3 * radix.s1 * radix.enc;
      const useNumericKey = Number.isSafeInteger(keySpace) && keySpace <= Number.MAX_SAFE_INTEGER;

      return {
        premium,
        guar,
        maxEnc,
        values,
        isInf,
        maxCounts,
        radix,
        useNumericKey,
        memo: new Map()
      };
    }

    function solve(ctx, input) {
      const EPS = 1e-12;
      const TARGET = 30;

      const clampCount = (id, raw) => {
        if (ctx.isInf[id]) return -1; // -1 = 無限
        const n = Math.max(0, Math.floor(Number(raw) || 0));
        return Math.min(n, ctx.maxCounts[id]);
      };

      const inv = input.inventory || {};
      const startInv = {
        s6: clampCount('s6', inv.s6),
        s5: clampCount('s5', inv.s5),
        s4: Math.max(0, Math.min(1, Math.floor(Number(inv.s4) || 0))),
        s3: clampCount('s3', inv.s3),
        s1: clampCount('s1', inv.s1)
      };

      const g = Math.max(0, Math.min(TARGET, Math.floor(Number(input.gauge) || 0)));
      // cf >= guar では以後の満腹確率が常に同じなので、guar+1個の状態に厳密圧縮できる。
      const phase = Math.max(0, Math.min(ctx.guar, Math.floor(Number(input.fedCount) || 0)));
      const enc = Math.max(0, Math.min(ctx.maxEnc, Math.floor(Number(input.encounters) || 0)));
      const chance = !!input.chance && phase === 0;

      const actions = [
        { id: 's1', val: 1, name: 'ポケ(1)' },
        { id: 's3', val: 3, name: 'スーパー(3)' },
        { id: 's4', val: ctx.values.s4, name: ctx.premium ? 'ボーナス+(4)' : 'ボーナス(3)' },
        { id: 's5', val: 5, name: 'ハイパー(5)' },
        { id: 's6', val: 6, name: 'ミュウツー(6)' }
      ];

      // index_logic_fixed.html と同じ同値時ルール。
      const tieRank = (a) => a.val * 10 + (a.id === 's4' ? 0 : 1);
      const encoded = (id, value) => ctx.isInf[id] ? 0 : value;

      const getCount = (id, s6, s5, s4, s3, s1) => {
        if (id === 's6') return s6;
        if (id === 's5') return s5;
        if (id === 's4') return s4;
        if (id === 's3') return s3;
        return s1;
      };

      const decrementForAction = (id, s6, s5, s4, s3, s1) => {
        let ns6 = s6, ns5 = s5, ns4 = s4, ns3 = s3, ns1 = s1;
        const count = getCount(id, s6, s5, s4, s3, s1);
        if (count !== -1) {
          if (id === 's6') ns6--;
          else if (id === 's5') ns5--;
          else if (id === 's4') ns4--;
          else if (id === 's3') ns3--;
          else ns1--;
        }
        return [ns6, ns5, ns4, ns3, ns1];
      };

      // PDF準拠の「確定取り切り」判定。
      // 残っている確定給餌回数の中で、最悪ケース（通常成功）でもゲージ30へ
      // 到達できるなら、その確定ルートを途中で捨てる行動や翌日送りを禁止する。
      // チャンス1投目は超成功でなくても必ず3倍なので、最低獲得量を3倍として扱う。
      const maxGuaranteedGain = (cp, cChance, s6, s5, s4, s3, s1) => {
        const throwsLeft = Math.max(0, ctx.guar - cp);
        if (throwsLeft <= 0) return 0;

        // 確定給餌は通常3回までなので、配列生成やsortを使わず5種類だけを直接走査する。
        // これにより、確定取り切り制約を追加しても14回ケースのDP速度を大きく落とさない。
        const topNormalGain = (limit, cs6, cs5, cs4, cs3, cs1) => {
          let total = 0;
          let c6 = cs6, c5 = cs5, c4 = cs4, c3 = cs3, c1 = cs1;
          for (let t = 0; t < limit; t++) {
            let bestId = null;
            let bestVal = -1;
            if (c6 !== 0 && 6 > bestVal) { bestId = 's6'; bestVal = 6; }
            if (c5 !== 0 && 5 > bestVal) { bestId = 's5'; bestVal = 5; }
            if (c4 !== 0 && ctx.values.s4 > bestVal) { bestId = 's4'; bestVal = ctx.values.s4; }
            if (c3 !== 0 && 3 > bestVal) { bestId = 's3'; bestVal = 3; }
            if (c1 !== 0 && 1 > bestVal) { bestId = 's1'; bestVal = 1; }
            if (bestId === null) break;

            total += bestVal;
            if (bestId === 's6' && c6 !== -1) c6--;
            else if (bestId === 's5' && c5 !== -1) c5--;
            else if (bestId === 's4' && c4 !== -1) c4--;
            else if (bestId === 's3' && c3 !== -1) c3--;
            else if (bestId === 's1' && c1 !== -1) c1--;
          }
          return total;
        };

        if (!(cChance && cp === 0)) {
          return topNormalGain(throwsLeft, s6, s5, s4, s3, s1);
        }

        // チャンス1投目だけは3倍対象が変わるため、5種類の初手だけを比較する。
        let best = 0;
        for (let ai = 0; ai < actions.length; ai++) {
          const a = actions[ai];
          const count = getCount(a.id, s6, s5, s4, s3, s1);
          if (count === 0) continue;
          const [ns6, ns5, ns4, ns3, ns1] = decrementForAction(a.id, s6, s5, s4, s3, s1);
          const gain = a.val * 3 + topNormalGain(throwsLeft - 1, ns6, ns5, ns4, ns3, ns1);
          if (gain > best) best = gain;
        }
        return best;
      };

      const canGuaranteeCatch = (cg, cp, cChance, s6, s5, s4, s3, s1) => {
        if (cg >= TARGET) return true;
        if (cp >= ctx.guar) return false;
        return cg + maxGuaranteedGain(cp, cChance, s6, s5, s4, s3, s1) >= TARGET;
      };

      const memoKey = (cg, cp, cChance, s6, s5, s4, s3, s1, ce) => {
        if (!ctx.useNumericKey) {
          return `${cg}|${cp}|${cChance ? 1 : 0}|${encoded('s6', s6)}|${encoded('s5', s5)}|${s4}|${encoded('s3', s3)}|${encoded('s1', s1)}|${ce}`;
        }
        let k = cg;
        k = k * ctx.radix.phase + cp;
        k = k * 2 + (cChance ? 1 : 0);
        k = k * ctx.radix.s6 + encoded('s6', s6);
        k = k * ctx.radix.s5 + encoded('s5', s5);
        k = k * ctx.radix.s4 + s4;
        k = k * ctx.radix.s3 + encoded('s3', s3);
        k = k * ctx.radix.s1 + encoded('s1', s1);
        k = k * ctx.radix.enc + ce;
        return k;
      };

      const nextEncounterEV = (gCarry, s6, s5, s3, s1, ce) => {
        if (ce <= 1) return 0;
        // 次の出会いではボーナスサブレが1枚に戻り、チャンスを10%で再抽選。
        return 0.1 * dp(gCarry, 0, 1, s6, s5, 1, s3, s1, ce - 1)[0]
             + 0.9 * dp(gCarry, 0, 0, s6, s5, 1, s3, s1, ce - 1)[0];
      };

      function dp(cg, cp, cChance, s6, s5, s4, s3, s1, ce) {
        if (ce <= 0) return [0, -1, 0];

        if (cg >= TARGET) {
          return [1 + nextEncounterEV(0, s6, s5, s3, s1, ce), -1, 1];
        }

        const key = memoKey(cg, cp, cChance, s6, s5, s4, s3, s1, ce);
        const hit = ctx.memo.get(key);
        if (hit !== undefined) return hit;

        const passEV = nextEncounterEV(cg, s6, s5, s3, s1, ce);
        const mustFinishNow = canGuaranteeCatch(cg, cp, cChance, s6, s5, s4, s3, s1);

        // PDFでは、確定給餌回数だけで取り切れる状態に入ったら、その日のうちに
        // 100%捕獲できるルートを優先する。したがって、この状態では翌日送りを候補から外す。
        let bestEV = mustFinishNow ? -Infinity : passEV;
        let bestAction = mustFinishNow ? -3 : -2; // -3 = 確定取り切り候補未選択
        let bestCatchProb = 0;
        const eatProb = cp >= ctx.guar ? 0.6 : 1.0;

        for (let ai = 0; ai < actions.length; ai++) {
          const a = actions[ai];
          let count;
          if (a.id === 's6') count = s6;
          else if (a.id === 's5') count = s5;
          else if (a.id === 's4') count = s4;
          else if (a.id === 's3') count = s3;
          else count = s1;
          if (count === 0) continue;

          let [ns6, ns5, ns4, ns3, ns1] = decrementForAction(a.id, s6, s5, s4, s3, s1);

          const np = Math.min(ctx.guar, cp + 1);

          if (mustFinishNow) {
            // 確定取り切り中は、最悪ケースでもこの一手の後に100%捕獲ルートが
            // 残る行動だけを許可する。チャンス1投目は最低3倍、それ以外は最低1倍。
            const minMultiplier = (cChance && cp === 0) ? 3 : 1;
            const worstCaseG = Math.min(TARGET, cg + a.val * minMultiplier);
            const preservesGuarantee = worstCaseG >= TARGET
              || canGuaranteeCatch(worstCaseG, np, false, ns6, ns5, ns4, ns3, ns1);
            if (!preservesGuarantee) continue;
          }

          const evAfterEat = (ng) => {
            const clamped = Math.min(TARGET, ng);
            if (clamped >= TARGET) {
              return 1 + nextEncounterEV(0, ns6, ns5, ns3, ns1, ce);
            }
            return dp(clamped, np, 0, ns6, ns5, ns4, ns3, ns1, ce)[0];
          };

          const pAfterEat = (ng) => {
            const clamped = Math.min(TARGET, ng);
            if (clamped >= TARGET) return 1;
            return dp(clamped, np, 0, ns6, ns5, ns4, ns3, ns1, ce)[2];
          };

          let eatEV;
          let eatCatchProb;
          if (cChance && cp === 0) {
            eatEV = 0.10 * evAfterEat(TARGET)
                  + 0.90 * evAfterEat(cg + a.val * 3);
            eatCatchProb = 0.10
                         + 0.90 * pAfterEat(cg + a.val * 3);
          } else {
            eatEV = 0.02 * evAfterEat(TARGET)
                  + 0.08 * evAfterEat(cg + a.val * 3)
                  + 0.90 * evAfterEat(cg + a.val);
            eatCatchProb = 0.02
                         + 0.08 * pAfterEat(cg + a.val * 3)
                         + 0.90 * pAfterEat(cg + a.val);
          }

          // 食べなかった場合はサブレ非消費でその出会いだけ終了。
          const expectedValue = eatProb * eatEV + (1 - eatProb) * passEV;
          const currentCatchProb = eatProb * eatCatchProb;

          if (expectedValue > bestEV + EPS) {
            bestEV = expectedValue;
            bestAction = ai;
            bestCatchProb = currentCatchProb;
          } else if (Math.abs(expectedValue - bestEV) <= EPS) {
            // ストップと同値ならストップ維持。サブレ同士のみ元版と同じ補助順位で決定。
            if (bestAction >= 0 && tieRank(a) < tieRank(actions[bestAction])) {
              bestEV = expectedValue;
              bestAction = ai;
              bestCatchProb = currentCatchProb;
            }
          }
        }

        // mustFinishNow=true なら理論上必ず候補が1つ以上ある。万一入力の不整合等で
        // 候補が見つからなかった場合だけ安全側で従来の翌日送りへフォールバックする。
        if (bestAction === -3) {
          bestEV = passEV;
          bestAction = -2;
          bestCatchProb = 0;
        }

        const out = [bestEV, bestAction, bestCatchProb];
        ctx.memo.set(key, out);
        return out;
      }

      const base = dp(
        g, phase, chance ? 1 : 0,
        startInv.s6, startInv.s5, startInv.s4, startInv.s3, startInv.s1, enc
      );

      // 既存UIの「大成功・満腹なし進行時」表示用ルートもWorker内で作り、
      // 同じメモを使い回してメインスレッド側の再計算をゼロにする。
      const route = [];
      let rg = g;
      let rp = phase;
      let rChance = chance;
      let rs6 = startInv.s6, rs5 = startInv.s5, rs4 = startInv.s4, rs3 = startInv.s3, rs1 = startInv.s1;

      for (let guard = 0; rg < TARGET && guard < 40; guard++) {
        const r = dp(rg, rp, rChance ? 1 : 0, rs6, rs5, rs4, rs3, rs1, enc);
        if (r[1] < 0) break;
        const a = actions[r[1]];
        route.push(a.name);

        if (a.id === 's6' && rs6 !== -1) rs6--;
        else if (a.id === 's5' && rs5 !== -1) rs5--;
        else if (a.id === 's4' && rs4 !== -1) rs4--;
        else if (a.id === 's3' && rs3 !== -1) rs3--;
        else if (a.id === 's1' && rs1 !== -1) rs1--;

        rg += a.val * (rChance ? 3 : 1);
        rp = Math.min(ctx.guar, rp + 1);
        rChance = false;
      }

      let action = null;
      if (base[1] >= 0) action = actions[base[1]];
      else if (base[1] === -2) action = { id: 'pass', val: 0, name: '➔ 翌日へ (ストップ)' };

      return {
        ev: base[0],
        catchProb: base[2],
        action,
        route,
        finalG: rg,
        memoStates: ctx.memo.size,
        numericMemoKey: ctx.useNumericKey
      };
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;


    const InputRow = React.memo(({ id, label, hasInfinity, value, onChange, max }) => {
      const isInf = value === '∞';
      const handleUp = () => {
        if (isInf) return;
        const curr = value === '' ? 0 : parseInt(value, 10);
        if (max !== undefined && curr >= max) return;
        onChange(id, curr + 1);
      };
      const handleDown = () => {
        if (isInf) return;
        const curr = value === '' ? 0 : parseInt(value, 10);
        onChange(id, Math.max(0, curr - 1));
      };
      const isDownDisabled = isInf || (value === '' ? 0 : parseInt(value, 10)) <= 0;
      const isUpDisabled = isInf || (max !== undefined && (value === '' ? 0 : parseInt(value, 10)) >= max);

      return (
        <div className="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
          <span className="text-sm font-medium text-gray-700">{label}</span>
          <div className="flex gap-2 items-center">
            <div className="w-8 flex justify-center">
              {hasInfinity && (
                <button 
                  onClick={() => onChange(id, isInf ? '0' : '∞')} 
                  className="px-2 py-1 bg-purple-100 text-purple-700 rounded text-xs font-bold active:bg-purple-200 hover:bg-purple-200 transition-colors"
                >
                  ∞
                </button>
              )}
            </div>
            <div className="flex gap-1 items-center">
              <button onClick={handleDown} disabled={isDownDisabled} className={`w-8 h-8 flex items-center justify-center rounded font-bold text-lg transition-colors ${isDownDisabled ? 'bg-gray-100 text-gray-300' : 'bg-gray-200 text-gray-700 active:bg-gray-300'}`}>−</button>
              <input type={isInf ? "text" : "number"} inputMode={isInf ? "text" : "numeric"} min="0" max={max} value={value} readOnly={isInf} onChange={(e) => onChange(id, e.target.value)} className="w-12 p-1 border border-gray-300 rounded text-center font-bold text-gray-700 focus:ring-2 focus:ring-purple-400 outline-none bg-white" />
              <button onClick={handleUp} disabled={isUpDisabled} className={`w-8 h-8 flex items-center justify-center rounded font-bold text-lg transition-colors ${isUpDisabled ? 'bg-gray-100 text-gray-300' : 'bg-gray-200 text-gray-700 active:bg-gray-300'}`}>＋</button>
            </div>
          </div>
        </div>
      );
    });

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
      });
      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) { console.error(error); }
      };
      return [storedValue, setValue];
    }

    const App = () => {
      const [inventory, setInventory] = useLocalStorage('mewtwo_inventory', { s6: 10, s5: 10, s4: 1, s3: 0, s1: '∞', encounters: 14 });
      const [formData, setFormData] = useState(inventory);
      const [gauge, setGauge] = useLocalStorage('mewtwo_gauge', 0);
      const [isChance, setIsChance] = useLocalStorage('mewtwo_isChance', false);
      const [fedCount, setFedCount] = useLocalStorage('mewtwo_fedCount', 0);
      const [guaranteedCount, setGuaranteedCount] = useLocalStorage('mewtwo_guaranteedCount', 3);
      const [isFull, setIsFull] = useLocalStorage('mewtwo_isFull', false);
      const [history, setHistory] = useLocalStorage('mewtwo_history', []);
      const [isPremium, setIsPremium] = useLocalStorage('mewtwo_isPremium', true);
      const workerRef = useRef(null);
      const requestRef = useRef(0);

      const [engineState, setEngineState] = useState({
        isCalculating: false,
        bestMove: { type: '計算中...', id: null, prob: 0 },
        expectedTotal: "計算中...",
        routeData: { route: [], finalG: 0 }
      });

      const actualGauge = gauge === '' ? 0 : gauge;

      const handleFormChange = useCallback((id, value) => {
        if (value === '∞') { setFormData(prev => ({ ...prev, [id]: '∞' })); return; }
        if (value === '') { setFormData(prev => ({ ...prev, [id]: '' })); return; }
        let strVal = value.toString().replace(/^0+(?=\d)/, '');
        let parsed = parseInt(strVal, 10);
        if (isNaN(parsed) || parsed < 0) parsed = 0;
        if (id === 's4' && parsed > 1) { parsed = 1; strVal = '1'; }
        setFormData(prev => ({ ...prev, [id]: strVal === '' ? '' : parsed }));
      }, []);

      const applySettings = () => {
        const cleanedData = { ...formData };
        ['s6', 's5', 's4', 's3', 's1', 'encounters'].forEach(key => {
          if (cleanedData[key] === '') cleanedData[key] = 0;
        });
        setInventory(cleanedData);
        setFormData(cleanedData);
      };

      const isModified = JSON.stringify(inventory) !== JSON.stringify(formData);

      // =========================================================================
      // PDF前提に忠実な期待値計算エンジン（Web Worker版）
      // ※ 計算内容は前段のロジック修正版と同じ。UIスレッドから計算だけを分離する。
      // =========================================================================
      useEffect(() => {
        let isCancelled = false;
        const requestId = ++requestRef.current;

        if (workerRef.current) {
          workerRef.current.terminate();
          workerRef.current = null;
        }

        if (actualGauge >= 30 || inventory.encounters <= 0) {
          setEngineState({
            isCalculating: false,
            bestMove: { type: '完了', id: null, prob: 1.0 },
            expectedTotal: "0.00",
            routeData: { route: [], finalG: actualGauge }
          });
          return;
        }

        setEngineState(prev => ({ ...prev, isCalculating: true, bestMove: { type: '計算中...', id: null, prob: 0 } }));

        const workerSource = document.getElementById('solver-worker').textContent;
        const workerUrl = URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' }));
        const worker = new Worker(workerUrl);
        workerRef.current = worker;

        const cleanupWorker = () => {
          worker.terminate();
          URL.revokeObjectURL(workerUrl);
          if (workerRef.current === worker) workerRef.current = null;
        };

        worker.onmessage = (event) => {
          if (isCancelled || requestId !== requestRef.current) return;
          const data = event.data || {};

          if (data.type === 'error') {
            console.error(data.message || 'Worker calculation error');
            setEngineState({
              isCalculating: false,
              bestMove: { type: 'エラー', id: null, prob: 0 },
              expectedTotal: "0.00",
              routeData: { route: [], finalG: actualGauge }
            });
            cleanupWorker();
            return;
          }

          const res = data.result;
          setEngineState({
            isCalculating: false,
            bestMove: res.action
              ? { type: res.action.name, id: res.action.id, prob: res.catchProb }
              : { type: '➔ 翌日へ (ストップ)', id: 'pass', prob: 0 },
            expectedTotal: res.ev.toFixed(2),
            routeData: { route: res.route || [], finalG: res.finalG }
          });
          cleanupWorker();
        };

        worker.onerror = (event) => {
          if (isCancelled || requestId !== requestRef.current) return;
          console.error(event.message || event);
          setEngineState({
            isCalculating: false,
            bestMove: { type: 'エラー', id: null, prob: 0 },
            expectedTotal: "0.00",
            routeData: { route: [], finalG: actualGauge }
          });
          cleanupWorker();
        };

        worker.postMessage({
          type: 'solve',
          requestId,
          premium: isPremium,
          guaranteedCount,
          state: {
            gauge: actualGauge,
            fedCount,
            chance: isChance,
            encounters: Number(inventory.encounters) || 0,
            inventory
          }
        });

        return () => {
          isCancelled = true;
          if (workerRef.current === worker) {
            worker.terminate();
            workerRef.current = null;
          }
          URL.revokeObjectURL(workerUrl);
        };
      }, [actualGauge, fedCount, isChance, inventory, guaranteedCount, isPremium]);

      const handleThrow = (multiplier) => {
        const actId = engineState.bestMove.id;
        if (!actId || actId === 'pass' || engineState.isCalculating) return;

        setHistory(prev => [...prev, { gauge, fedCount, isChance, isFull, inventory: { ...inventory }, formData: { ...formData } }]);

        if (multiplier === 0) { setIsFull(true); return; }

        let actualMultiplier = multiplier;
        if (isChance && multiplier === 1) actualMultiplier = 3;

        let val = actId === 's6' ? 6 : actId === 's5' ? 5 : actId === 's4' ? (isPremium ? 4 : 3) : actId === 's3' ? 3 : 1;
        let added = actualMultiplier === 30 ? 30 : val * actualMultiplier;

        if (inventory[actId] !== '∞') {
          const nextCount = Math.max(0, inventory[actId] - 1);
          setInventory(prev => ({ ...prev, [actId]: nextCount }));
          setFormData(prev => ({ ...prev, [actId]: nextCount }));
        }

        setGauge(Math.min(30, actualGauge + added));
        setFedCount(fedCount + 1);
        setIsChance(false);
      };

      const undoMove = () => {
        if (history.length === 0) return;
        const last = history[history.length - 1];
        setGauge(last.gauge);
        setFedCount(last.fedCount);
        setIsChance(last.isChance);
        setIsFull(last.isFull || false); 
        setInventory(last.inventory);
        setFormData(last.formData);
        setHistory(prev => prev.slice(0, -1));
      };

      const resetGaugeOnly = () => {
        if (window.confirm("フレンドポイントと食べた枚数を0にリセットしますか？")) {
          setGauge(0); setFedCount(0); setIsChance(false); setIsFull(false); setHistory([]);
        }
      };

      const resetEncounter = () => {
        if (actualGauge >= 30) setGauge(0);
        setFedCount(0); setIsChance(false); setIsFull(false); setHistory([]);
        setInventory(prev => {
          const next = { ...prev };
          const curr = next.encounters === '' ? 0 : parseInt(next.encounters, 10);
          if (curr > 0) next.encounters = curr - 1;
          next.s4 = 1; 
          return next;
        });
        setFormData(prev => {
          const next = { ...prev };
          const curr = next.encounters === '' ? 0 : parseInt(next.encounters, 10);
          if (curr > 0) next.encounters = curr - 1;
          next.s4 = 1; 
          return next;
        });
      };

      return (
        <div className="min-h-screen max-w-md mx-auto bg-gray-200 flex flex-col pb-10">
          <header className="bg-white px-4 pt-8 pb-3 shadow-sm sticky top-0 z-10">
            <h1 className="text-lg font-black text-purple-900 tracking-tight flex items-center gap-2">
              <span className="bg-purple-600 text-white px-2 py-1 rounded text-xs">Opt</span>ミュウツーサブレ
            </h1>
          </header>

          <main className="flex-1 overflow-y-auto p-4 space-y-4">
            <div className="bg-white rounded-2xl shadow-sm p-5 border-t-4 border-purple-600">
              <h2 className="text-sm font-bold text-gray-500 mb-4">実践シミュレーター</h2>
              <div className="flex items-center justify-between mb-2">
                <span className="text-sm text-gray-600 font-bold">フレンドポイント</span>
                <div className="flex items-center gap-2">
                  <button onClick={resetGaugeOnly} className="text-xs bg-gray-200 px-2 py-1 rounded font-bold text-gray-600 active:bg-gray-300 hover:bg-gray-300 transition-colors">リセット</button>
                  <div className="flex items-baseline">
                    <input type="number" inputMode="numeric" min="0" max="30" value={gauge} onChange={(e) => {
                        const val = e.target.value;
                        if (val === '') { setGauge(''); setHistory([]); setIsFull(false); return; }
                        let strVal = val.replace(/^0+(?=\d)/, '');
                        let parsed = parseInt(strVal, 10);
                        if (isNaN(parsed) || parsed < 0) parsed = 0;
                        if (parsed > 30) parsed = 30;
                        setGauge(parsed); setHistory([]); setIsFull(false);
                      }} className="w-12 p-0 text-right font-black text-purple-700 text-2xl bg-transparent border-b-2 border-dashed border-purple-400 focus:border-solid focus:border-purple-600 focus:outline-none transition-colors" />
                    <span className="text-2xl font-black text-purple-700 ml-1">/ 30</span>
                  </div>
                </div>
              </div>
              
              <div className="w-full bg-gray-200 rounded-full h-3 mb-5 overflow-hidden">
                <div className="bg-purple-600 h-3 rounded-full transition-all duration-500 ease-out" style={{ width: `${(Math.min(30, actualGauge) / 30) * 100}%` }}></div>
              </div>

              <div className="flex gap-4 mb-4 bg-purple-50 p-3 rounded-xl border border-purple-100">
                <label className={`flex items-center space-x-2 text-sm font-bold w-full cursor-pointer ${fedCount > 0 || actualGauge >= 30 || isFull || engineState.isCalculating ? 'text-gray-400 opacity-70' : 'text-purple-900'}`}>
                  <input type="checkbox" checked={isChance} onChange={(e) => setIsChance(e.target.checked)} className="rounded w-5 h-5 text-purple-600 focus:ring-purple-500 border-gray-300" disabled={fedCount > 0 || actualGauge >= 30 || isFull || engineState.isCalculating} />
                  <span>チャンス状態 (1投目のみ)</span>
                </label>
              </div>

              <div className="flex justify-between items-center mb-1 text-sm font-medium text-gray-700">
                <span>確定ライン:</span>
                <select value={guaranteedCount} onChange={(e) => setGuaranteedCount(Number(e.target.value))} className="border-gray-300 rounded shadow-sm focus:ring-purple-500 p-1 bg-gray-50" disabled={isFull || engineState.isCalculating}>
                  <option value={3}>3枚 (通常)</option>
                  <option value={2}>2枚</option>
                </select>
              </div>
              <p className="text-xs text-gray-400 text-right mb-4">現在 {fedCount + 1} 枚目（{fedCount >= guaranteedCount ? '⚠️満腹リスクあり' : '✅確定ライン'}）</p>

              <div className="bg-gradient-to-b from-purple-50 to-white rounded-2xl shadow-inner p-5 text-center border border-gray-100 relative">
                <p className="text-xs text-gray-500 font-bold mb-1">次の一手</p>
                <p className={`text-3xl font-black text-purple-900 mb-3 transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                  {isFull ? '満腹 (逃走)' : engineState.bestMove.type}
                </p>
                
                {!isFull && engineState.bestMove.type !== '完了' && engineState.bestMove.id !== 'pass' && (
                  <div className={`mb-4 bg-white bg-opacity-80 rounded-lg p-3 text-sm text-gray-700 shadow-sm border border-purple-100 text-left w-full transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                    <div className="flex justify-between border-b border-gray-100 pb-2 mb-2">
                      <span className="font-bold text-gray-600">この回の捕獲確率:</span>
                      <span className="font-black text-purple-700">{(engineState.bestMove.prob * 100).toFixed(1)}%</span>
                    </div>
                    <div>
                      <span className="font-bold text-gray-600 block mb-2 text-xs">想定ルート (大成功・満腹なし進行時):</span>
                      <div className="text-xs text-gray-600 flex flex-wrap gap-1 items-center">
                        {engineState.routeData.route.map((step, idx) => (
                          <React.Fragment key={idx}>
                            <span className="bg-purple-100 text-purple-800 px-2 py-1 rounded font-medium">{step}</span>
                            {idx < engineState.routeData.route.length - 1 && <span className="text-gray-400">➔</span>}
                          </React.Fragment>
                        ))}
                        {engineState.routeData.finalG >= 30 ? (
                          <span className="text-green-600 font-bold ml-1">GET!</span>
                        ) : (
                          <span className="text-gray-500 font-bold ml-1 text-xs">➔ 翌日へ</span>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {!isFull && engineState.bestMove.type !== '完了' && engineState.bestMove.id !== 'pass' && (
                  <>
                    <p className="text-xs text-gray-400 mb-2">実際の結果をタップ（所持数は自動で減ります）</p>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <button onClick={() => handleThrow(1)} disabled={engineState.isCalculating} className={`bg-white border border-purple-200 text-purple-700 py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-purple-100 active:scale-95'}`}>通常</button>
                      <button onClick={() => handleThrow(3)} disabled={engineState.isCalculating} className={`bg-purple-600 text-white py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-purple-700 active:scale-95'}`}>大成功 (3倍)</button>
                      <button onClick={() => handleThrow(30)} disabled={engineState.isCalculating} className={`bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:opacity-80 active:scale-95'}`}>超成功 (一発)</button>
                      <button onClick={() => handleThrow(0)} disabled={engineState.isCalculating || fedCount < guaranteedCount} className={`bg-gray-400 text-white py-3 rounded-xl font-bold shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : fedCount < guaranteedCount ? 'opacity-50 cursor-not-allowed' : 'active:bg-gray-500 active:scale-95'}`}>満腹 (逃走)</button>
                    </div>
                  </>
                )}

                {isFull && (
                  <div className="mb-4 bg-gray-100 rounded-lg p-4 text-sm text-gray-700 shadow-sm border border-gray-200 text-center fade-in">
                    <p className="font-black text-gray-600 mb-1 text-lg">満腹になりました</p>
                    <p className="text-xs text-gray-500 font-bold">今日の判定はここで終了です。<br/>「次の出会いへ進む」を押してください。</p>
                  </div>
                )}

                {!isFull && engineState.bestMove.id === 'pass' && (
                  <div className={`mb-4 bg-purple-50 rounded-lg p-4 text-sm text-purple-900 shadow-sm border border-purple-200 text-center transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                    <p className="font-black mb-1 text-lg">今日はここでストップ！</p>
                    <p className="text-xs font-bold">無理をして投げるより、翌日に回す方がお得です。<br/>「次の出会いへ進む」を押してください。</p>
                  </div>
                )}
                
                {history.length > 0 && (
                  <button onClick={undoMove} disabled={engineState.isCalculating} className={`w-full mt-2 py-3 bg-gray-200 text-gray-700 font-bold text-sm rounded-xl transition-all flex items-center justify-center gap-1 ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-gray-300 hover:bg-gray-300'}`}>
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                    1手戻る (誤タップ修正)
                  </button>
                )}
              </div>
              <button onClick={resetEncounter} disabled={engineState.isCalculating} className={`w-full mt-4 py-4 bg-purple-100 text-purple-700 font-black text-sm rounded-xl shadow-sm transition-all ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'active:bg-purple-200 hover:bg-purple-200'}`}>次の出会いへ進む (残り回数-1)</button>
            </div>

            <div className="bg-white rounded-2xl shadow-sm p-5 flex items-center justify-between">
              <div>
                <h2 className="text-sm font-bold text-gray-800">残り期待捕獲数</h2>
                <p className="text-xs text-gray-400">現在の在庫・残り出会い回数による期待値</p>
              </div>
              <div className={`text-right transition-opacity ${engineState.isCalculating ? 'opacity-50' : 'opacity-100'}`}>
                <span className="text-2xl font-black text-purple-700">{engineState.expectedTotal}</span>
                <span className="text-sm text-gray-500 ml-1">体</span>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-sm p-5 pb-8 relative">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-sm font-bold text-gray-800">サブレ所持数・設定</h2>
                <label className="flex items-center cursor-pointer">
                  <div className="relative">
                    <input type="checkbox" className="sr-only" checked={isPremium} onChange={(e) => { setIsPremium(e.target.checked); }} disabled={engineState.isCalculating} />
                    <div className={`block w-10 h-6 rounded-full transition-colors ${isPremium ? 'bg-purple-500' : 'bg-gray-300'}`}></div>
                    <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${isPremium ? 'transform translate-x-4' : ''}`}></div>
                  </div>
                  <span className={`ml-2 text-xs font-bold ${isPremium ? 'text-purple-700' : 'text-gray-500'}`}>プレパス</span>
                </label>
              </div>

              <div className="space-y-3">
                <InputRow id="s6" label="ミュウツーサブレ (6)" hasInfinity={false} value={formData.s6} onChange={handleFormChange} />
                <InputRow id="s5" label="ハイパーサブレ (5)" hasInfinity={false} value={formData.s5} onChange={handleFormChange} />
                <InputRow id="s4" label={isPremium ? "ボーナスサブレ+ (4)" : "ボーナスサブレ (3)"} hasInfinity={false} value={formData.s4} onChange={handleFormChange} max={1} />
                <InputRow id="s3" label="スーパーサブレ (3)" hasInfinity={true} value={formData.s3} onChange={handleFormChange} />
                <InputRow id="s1" label="ポケサブレ (1)" hasInfinity={true} value={formData.s1} onChange={handleFormChange} />
                <InputRow id="encounters" label="残り出会い回数" hasInfinity={false} value={formData.encounters} onChange={handleFormChange} />
              </div>

              {isModified && (
                <div className="mt-5 fade-in">
                  <button onClick={applySettings} disabled={engineState.isCalculating} className={`w-full bg-purple-600 text-white py-3 rounded-xl font-bold shadow-md transition-all text-lg ${engineState.isCalculating ? 'opacity-50 cursor-wait' : 'hover:bg-purple-700 active:scale-95'}`}>
                    設定を適用して再計算
                  </button>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
