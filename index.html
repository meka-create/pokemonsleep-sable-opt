<body>

  <script id="solver-worker" type="text/plain">
    'use strict';

    self.onmessage = (event) => {
      const msg = event.data || {};
      if (msg.type !== 'solve') return;

      const startedAt = performance.now();
      try {
        const context = makeContext({
          premium: !!msg.premium,
          guaranteedCount: msg.guaranteedCount,
          maxEncounters: msg.state?.encounters,
          inventory: msg.state?.inventory || {}
        });
        const result = solve(context, msg.state || {});
        result.calcMs = performance.now() - startedAt;
        self.postMessage({ type: 'result', requestId: msg.requestId, result });
      } catch (error) {
        self.postMessage({
          type: 'error',
          requestId: msg.requestId,
          message: error && error.stack ? error.stack : String(error)
        });
      }
    };

    function makeContext(cfg) {
      const premium = !!cfg.premium;
      const guar = Math.max(1, Math.floor(Number(cfg.guaranteedCount) || 3));
      const maxEnc = Math.max(0, Math.floor(Number(cfg.maxEncounters) || 0));
      const values = { s6: 6, s5: 5, s4: premium ? 4 : 3, s3: 3, s1: 1 };
      const ids = ['s6', 's5', 's4', 's3', 's1'];
      const maxCounts = {};
      const isInf = {};

      for (const id of ids) {
        const raw = cfg.inventory?.[id];
        isInf[id] = raw === '∞';
        if (isInf[id]) {
          maxCounts[id] = 0;
          continue;
        }

        const n = Math.max(0, Math.floor(Number(raw) || 0));
        if (id === 's4') {
          // ボーナスサブレはUI上も1枚が上限で、次の出会いで1枚に戻る。
          maxCounts[id] = Math.min(n, 1);
        } else {
          // 厳密な上限。1回の捕獲までに、この種類だけを通常成功で投げ続けても
          // ceil(30 / value)枚で必ずゲージ30に到達する。
          // 捕獲できる回数は残り出会い回数を超えないため、これを超える在庫は
          // イベント中に物理的に消費できず、最適行動にも影響しない。
          const horizonCap = maxEnc * Math.ceil(30 / values[id]);
          maxCounts[id] = Math.min(n, horizonCap);
        }
      }

      const radix = {
        phase: guar + 1,
        s6: isInf.s6 ? 1 : maxCounts.s6 + 1,
        s5: isInf.s5 ? 1 : maxCounts.s5 + 1,
        s4: 2,
        s3: isInf.s3 ? 1 : maxCounts.s3 + 1,
        s1: isInf.s1 ? 1 : maxCounts.s1 + 1,
        enc: maxEnc + 1
      };

      // 通常の14回ケースではNumberの整数キーで安全に一意化できる。
      // 極端に大きいユーザー入力だけ文字列キーへ自動フォールバックする。
      let keySpace = 31 * radix.phase * 2;
      keySpace *= radix.s6 * radix.s5 * radix.s4 * radix.s3 * radix.s1 * radix.enc;
      const useNumericKey = Number.isSafeInteger(keySpace) && keySpace <= Number.MAX_SAFE_INTEGER;
      const makeMemo = () => {
        const DENSE_LIMIT = 10000000;
        if (useNumericKey && keySpace <= DENSE_LIMIT) {
          const ev = new Float64Array(keySpace);
          const action = new Int8Array(keySpace);
          action.fill(-128);
          let memoSize = 0;
          return {
            getEV(k) { return action[k] === -128 ? undefined : ev[k]; },
            getAction(k) { return action[k]; },
            set(k, value, bestAction) {
              if (action[k] === -128) memoSize++;
              ev[k] = value; action[k] = bestAction;
            },
            get size() { return memoSize; }
          };
        }
        const map = new Map();
        return {
          getEV(k) { const v = map.get(k); return v === undefined ? undefined : v[0]; },
          getAction(k) { const v = map.get(k); return v === undefined ? -128 : v[1]; },
          set(k, value, bestAction) { map.set(k, [value, bestAction]); },
          get size() { return map.size; }
        };
      };

      return {
        premium,
        guar,
        maxEnc,
        values,
        isInf,
        maxCounts,
        radix,
        useNumericKey,
        memo: makeMemo()
      };
    }

    function solve(ctx, input) {
      const EPS = 1e-12;
      const TARGET = 30;

      const clampCount = (id, raw) => {
        if (ctx.isInf[id]) return -1; // -1 = 無限
        const n = Math.max(0, Math.floor(Number(raw) || 0));
        return Math.min(n, ctx.maxCounts[id]);
      };

      const inv = input.inventory || {};
      const startInv = {
        s6: clampCount('s6', inv.s6),
        s5: clampCount('s5', inv.s5),
        s4: Math.max(0, Math.min(1, Math.floor(Number(inv.s4) || 0))),
        s3: clampCount('s3', inv.s3),
        s1: clampCount('s1', inv.s1)
      };

      const g = Math.max(0, Math.min(TARGET, Math.floor(Number(input.gauge) || 0)));
      // cf >= guar では以後の満腹確率が常に同じなので、guar+1個の状態に厳密圧縮できる。
      const phase = Math.max(0, Math.min(ctx.guar, Math.floor(Number(input.fedCount) || 0)));
      const enc = Math.max(0, Math.min(ctx.maxEnc, Math.floor(Number(input.encounters) || 0)));
      const chance = !!input.chance && phase === 0;

      const actions = [
        { id: 's1', val: 1, name: 'ポケ(1)' },
        { id: 's3', val: 3, name: 'スーパー(3)' },
        { id: 's4', val: ctx.values.s4, name: ctx.premium ? 'ボーナス+(4)' : 'ボーナス(3)' },
        { id: 's5', val: 5, name: 'ハイパー(5)' },
        { id: 's6', val: 6, name: 'ミュウツー(6)' }
      ];

      // index_logic_fixed.html と同じ同値時ルール。
      const tieRank = (a) => a.val * 10 + (a.id === 's4' ? 0 : 1);
      const encoded = (id, value) => ctx.isInf[id] ? 0 : value;

      const getCount = (id, s6, s5, s4, s3, s1) => {
        if (id === 's6') return s6;
        if (id === 's5') return s5;
        if (id === 's4') return s4;
        if (id === 's3') return s3;
        return s1;
      };

      const decrementForAction = (id, s6, s5, s4, s3, s1) => {
        let ns6 = s6, ns5 = s5, ns4 = s4, ns3 = s3, ns1 = s1;
        const count = getCount(id, s6, s5, s4, s3, s1);
        if (count !== -1) {
          if (id === 's6') ns6--;
          else if (id === 's5') ns5--;
          else if (id === 's4') ns4--;
          else if (id === 's3') ns3--;
          else ns1--;
        }
        return [ns6, ns5, ns4, ns3, ns1];
      };

      // PDF準拠ポリシーは「最初の3枚を必ず食べる」というPDF本文の前提にだけ適用する。
      // UIの「2枚」はカスタム条件として計算できるが、PDF固有の行動ルールは強制しない。
      const pdfStandardMode = ctx.guar === 3;

      // PDF準拠の「確定取り切り」判定。
      // 残っている確定給餌回数の中で、最悪ケース（通常成功）でもゲージ30へ
      // 到達できるなら、その日のうちに取り切れる状態とみなす。
      // チャンス1投目は超成功でなくても必ず3倍なので、最低獲得量を3倍として扱う。
      const maxGuaranteedGain = (cp, cChance, s6, s5, s4, s3, s1) => {
        const throwsLeft = Math.max(0, ctx.guar - cp);
        if (throwsLeft <= 0) return 0;

        const topNormalGain = (limit, cs6, cs5, cs4, cs3, cs1) => {
          let total = 0;
          let c6 = cs6, c5 = cs5, c4 = cs4, c3 = cs3, c1 = cs1;
          for (let t = 0; t < limit; t++) {
            let bestId = null;
            let bestVal = -1;
            if (c6 !== 0 && 6 > bestVal) { bestId = 's6'; bestVal = 6; }
            if (c5 !== 0 && 5 > bestVal) { bestId = 's5'; bestVal = 5; }
            if (c4 !== 0 && ctx.values.s4 > bestVal) { bestId = 's4'; bestVal = ctx.values.s4; }
            if (c3 !== 0 && 3 > bestVal) { bestId = 's3'; bestVal = 3; }
            if (c1 !== 0 && 1 > bestVal) { bestId = 's1'; bestVal = 1; }
            if (bestId === null) break;

            total += bestVal;
            if (bestId === 's6' && c6 !== -1) c6--;
            else if (bestId === 's5' && c5 !== -1) c5--;
            else if (bestId === 's4' && c4 !== -1) c4--;
            else if (bestId === 's3' && c3 !== -1) c3--;
            else if (bestId === 's1' && c1 !== -1) c1--;
          }
          return total;
        };

        if (!(cChance && cp === 0)) {
          return topNormalGain(throwsLeft, s6, s5, s4, s3, s1);
        }

        let best = 0;
        for (let ai = 0; ai < actions.length; ai++) {
          const a = actions[ai];
          const count = getCount(a.id, s6, s5, s4, s3, s1);
          if (count === 0) continue;
          const [ns6, ns5, ns4, ns3, ns1] = decrementForAction(a.id, s6, s5, s4, s3, s1);
          const gain = a.val * 3 + topNormalGain(throwsLeft - 1, ns6, ns5, ns4, ns3, ns1);
          if (gain > best) best = gain;
        }
        return best;
      };

      const canGuaranteeCatch = (cg, cp, cChance, s6, s5, s4, s3, s1) => {
        if (cg >= TARGET) return true;
        if (cp >= ctx.guar) return false;
        return cg + maxGuaranteedGain(cp, cChance, s6, s5, s4, s3, s1) >= TARGET;
      };

      const countAvailable = (v) => v === -1 || v > 0;
      const actionIndex = (id) => actions.findIndex(a => a.id === id);

      // X記事の3タイプは固定ではなく、手持ちに応じて行き来する。
      // 判定を一箇所に集約し、初手表・16〜18の温存比較・6余り目安で
      // 同じ分類を使う。ハイパーが残っている間はハイパー型、
      // ハイパーがなくスーパーを残り遭遇ごとに1枚以上回せるならスーパー型、
      // それ未満の有限在庫ならポケ中心寄りとする。
      const strategyType = (ce, s5, s3) => {
        if (countAvailable(s5)) return 'hyper';
        if (s3 === -1) return 'super';
        return Math.max(0, s3) >= Math.max(1, ce) ? 'super' : 'poke';
      };

      // 「今この1投を投げても、最悪ケースで保証内100%捕獲を維持できるか」。
      // 確定取り切り中は候補をこの条件だけに絞り、その中では残りイベント全体の
      // 期待捕獲数をDPで比較する。PDF/X記事の表や小さい順は同期待値時のタイブレーク。
      const actionPreservesGuaranteedFinish = (ai, cg, cp, cChance, s6, s5, s4, s3, s1) => {
        const a = actions[ai];
        const count = getCount(a.id, s6, s5, s4, s3, s1);
        if (count === 0) return false;
        const [ns6, ns5, ns4, ns3, ns1] = decrementForAction(a.id, s6, s5, s4, s3, s1);
        const minMultiplier = (cChance && cp === 0) ? 3 : 1;
        const ng = Math.min(TARGET, cg + a.val * minMultiplier);
        if (ng >= TARGET) return true;
        const np = Math.min(ctx.guar, cp + 1);
        return canGuaranteeCatch(ng, np, false, ns6, ns5, ns4, ns3, ns1);
      };

      // PDFの表は「その日まだ1枚も投げていない・チャンスなし・ボーナス未使用」の表。
      // その条件に一致する代表3タイプでは表の初手を優先し、途中結果は上の確率的再計画に戻す。
      const pdfStartPreferredAction = (cg, cp, cChance, s6, s5, s4, s3, s1, ce) => {
        if (!pdfStandardMode || cp !== 0 || cChance || s4 <= 0) return -1;
        const rem = TARGET - cg;
        if (rem <= 0 || rem > 18) return -1;

        let id = null;
        const type = strategyType(ce, s5, s3);

        if (type === 'hyper') {
          if (rem === 18) id = 's6';
          else if (rem === 17) id = 's5';
          else if (rem === 16 || rem === 15) id = 's5';
          else if (rem >= 13 && rem <= 14) id = 's4';
          else if (rem >= 11 && rem <= 12) id = 's3';
          else if (rem >= 9 && rem <= 10) id = 's3';
        } else if (type === 'super') {
          if (rem >= 17 && rem <= 18) id = 's6';
          else if (rem >= 14 && rem <= 16) id = 's4';
          else if (rem >= 12 && rem <= 13) id = 's3';
          else if (rem === 11) id = 's1';
          else if (rem >= 9 && rem <= 10) id = 's3';
          else if (rem >= 7 && rem <= 8) id = 's3';
          else if (rem === 6) id = 's1';
        } else if (type === 'poke') {
          if (rem >= 16 && rem <= 18) id = 's6';
          else if (rem >= 13 && rem <= 15) id = 's4';
          else if (rem >= 9 && rem <= 12) id = 's1';
          else if (rem >= 7 && rem <= 8) id = 's4';
          // 最新版X記事の「残り6の小技」は、6を固定せず
          // 1→1で大成功・超成功による6節約も含めてDP比較する。
          else if (rem === 6) return -1;
        }

        if (!id) return -1;
        const ai = actionIndex(id);
        if (ai < 0 || getCount(id, s6, s5, s4, s3, s1) === 0) return -1;

        // 在庫がPDF標準例と違う場合でも、通常成功後に100%取り切りを維持できる時だけ強制。
        const a = actions[ai];
        const [ns6, ns5, ns4, ns3, ns1] = decrementForAction(id, s6, s5, s4, s3, s1);
        const ng = Math.min(TARGET, cg + a.val);
        if (ng >= TARGET || canGuaranteeCatch(ng, 1, false, ns6, ns5, ns4, ns3, ns1)) return ai;
        return -1;
      };

      // X記事の「6が余りそう」は厳密な境界ではなく目安。
      // 分類は strategyType() と統一し、本文のざっくり式だけを使う。
      // 閾値到達時も6を強制せず、残り19以上での「6禁止」を解除してDP比較に戻すだけ。
      const s6SurplusThreshold = (ce, s5, s3) => {
        const type = strategyType(ce, s5, s3);
        if (type === 'poke') return Math.max(3, ce * 2);
        return Math.max(3, ce + 3);
      };

      const isS6Surplus = (ce, s6, s5, s3) => {
        if (s6 === -1) return true;
        return s6 >= s6SurplusThreshold(ce, s5, s3);
      };

      const memoKey = (cg, cp, cChance, s6, s5, s4, s3, s1, ce) => {
        if (!ctx.useNumericKey) {
          return `${cg}|${cp}|${cChance ? 1 : 0}|${encoded('s6', s6)}|${encoded('s5', s5)}|${s4}|${encoded('s3', s3)}|${encoded('s1', s1)}|${ce}`;
        }
        let k = cg;
        k = k * ctx.radix.phase + cp;
        k = k * 2 + (cChance ? 1 : 0);
        k = k * ctx.radix.s6 + encoded('s6', s6);
        k = k * ctx.radix.s5 + encoded('s5', s5);
        k = k * ctx.radix.s4 + s4;
        k = k * ctx.radix.s3 + encoded('s3', s3);
        k = k * ctx.radix.s1 + encoded('s1', s1);
        k = k * ctx.radix.enc + ce;
        return k;
      };

      const nextEncounterEV = (gCarry, s6, s5, s3, s1, ce) => {
        if (ce <= 1) return 0;
        // 次の出会いではボーナスサブレが1枚に戻り、チャンスを10%で再抽選。
        return 0.1 * dp(gCarry, 0, 1, s6, s5, 1, s3, s1, ce - 1)
             + 0.9 * dp(gCarry, 0, 0, s6, s5, 1, s3, s1, ce - 1);
      };

      // 現在遭遇の捕獲確率は、DPの主目的（イベント全体の期待捕獲数）とは分離して扱う。
      // ただし期待値が同値の行動同士を比較する時だけ、ボーナスサブレ優先の判定に使う。
      const catchMemo = new Map();
      // 4 vs 3 の同値判定などで「この1手を固定した場合の当該遭遇捕獲率」を
      // 同じ状態について何度も再計算しないための専用キャッシュ。
      const forcedCatchMemo = new Map();

      function policyAction(cg, cp, cChance, s6, s5, s4, s3, s1, ce) {
        if (ce <= 0 || cg >= TARGET) return -1;
        const key = memoKey(cg, cp, cChance, s6, s5, s4, s3, s1, ce);
        dp(cg, cp, cChance, s6, s5, s4, s3, s1, ce);
        return ctx.memo.getAction(key);
      }

      function policyCatchProb(cg, cp, cChance, s6, s5, s4, s3, s1, ce) {
        if (cg >= TARGET) return 1;
        if (ce <= 0) return 0;
        const k = memoKey(cg, cp, cChance, s6, s5, s4, s3, s1, ce);
        const cached = catchMemo.get(k);
        if (cached !== undefined) return cached;
        const ai = policyAction(cg, cp, cChance, s6, s5, s4, s3, s1, ce);
        if (ai < 0) { catchMemo.set(k, 0); return 0; }
        const a = actions[ai];
        const [ns6, ns5, ns4, ns3, ns1] = decrementForAction(a.id, s6, s5, s4, s3, s1);
        const np = Math.min(ctx.guar, cp + 1);
        const afterEat = (ng) => {
          const clamped = Math.min(TARGET, ng);
          return clamped >= TARGET ? 1 : policyCatchProb(clamped, np, 0, ns6, ns5, ns4, ns3, ns1, ce);
        };
        let pEat;
        if (cChance && cp === 0) pEat = 0.10 + 0.90 * afterEat(cg + a.val * 3);
        else pEat = 0.02 + 0.08 * afterEat(cg + a.val * 3) + 0.90 * afterEat(cg + a.val);
        const eatProb = cp >= ctx.guar ? 0.6 : 1.0;
        const out = eatProb * pEat;
        catchMemo.set(k, out);
        return out;
      }

      const forcedActionCatchProb = (ai, cg, cp, cChance, s6, s5, s4, s3, s1, ce) => {
        if (ai < 0 || cg >= TARGET || ce <= 0) return 0;
        const stateKey = memoKey(cg, cp, cChance, s6, s5, s4, s3, s1, ce);
        const forcedKey = `${stateKey}|${ai}`;
        const cached = forcedCatchMemo.get(forcedKey);
        if (cached !== undefined) return cached;
        const a = actions[ai];
        const [ns6, ns5, ns4, ns3, ns1] = decrementForAction(a.id, s6, s5, s4, s3, s1);
        const np = Math.min(ctx.guar, cp + 1);
        const afterEat = (ng) => {
          const clamped = Math.min(TARGET, ng);
          return clamped >= TARGET ? 1 : policyCatchProb(clamped, np, 0, ns6, ns5, ns4, ns3, ns1, ce);
        };
        let pEat;
        if (cChance && cp === 0) pEat = 0.10 + 0.90 * afterEat(cg + a.val * 3);
        else pEat = 0.02 + 0.08 * afterEat(cg + a.val * 3) + 0.90 * afterEat(cg + a.val);
        const eatProb = cp >= ctx.guar ? 0.6 : 1.0;
        const out = eatProb * pEat;
        forcedCatchMemo.set(forcedKey, out);
        return out;
      };

      function dp(cg, cp, cChance, s6, s5, s4, s3, s1, ce) {
        if (ce <= 0) return 0;

        if (cg >= TARGET) {
          return 1 + nextEncounterEV(0, s6, s5, s3, s1, ce);
        }

        const key = memoKey(cg, cp, cChance, s6, s5, s4, s3, s1, ce);
        const hit = ctx.memo.getEV(key);
        if (hit !== undefined) return hit;

        const passEV = nextEncounterEV(cg, s6, s5, s3, s1, ce);
        const guaranteedFinish = pdfStandardMode
          && canGuaranteeCatch(cg, cp, cChance, s6, s5, s4, s3, s1);

        const remainingGauge = TARGET - cg;
        const normalNonChance = !cChance;
        const type = strategyType(ce, s5, s3);

        // 最新版X.pdfの「保証が残り1枚」の意味に限定する。
        // 以前のように「保証が残り1枚なら当日捕獲率を最大化」するのではなく、
        // “その確定1枚だけで捕まえ切れるサブレがある”場合にだけ確定捕獲を優先する。
        // （この場合は bestGuaranteedPlan 自体が1投完結ルートを返す。）
        const oneGuaranteedLeftException = pdfStandardMode
          && cp === ctx.guar - 1
          && actions.some((a) => {
            const count = getCount(a.id, s6, s5, s4, s3, s1);
            if (count === 0) return false;
            const guaranteedMult = (cChance && cp === 0) ? 3 : 1;
            return cg + a.val * guaranteedMult >= TARGET;
          });

        // X記事で残り16〜18の温存例外が明示されているのはポケ中心寄り。
        // 3タイプ自体は手持ちに応じて行き来するため、固定在庫名ではなく strategyType() の
        // 柔軟な判定が 'poke' の時だけ「今100%で取り切る」対「6を温存する」をDP比較する。
        // ハイパー／スーパー中心では記事の共通ルールどおり保証内の確定捕獲を優先する。
        const allowEarlyPreserveComparison = pdfStandardMode
          && guaranteedFinish
          && type === 'poke'
          && normalNonChance
          && remainingGauge >= 16
          && remainingGauge <= 18
          && ce > 1
          && !oneGuaranteedLeftException;
        const mustFinishNow = guaranteedFinish && !allowEarlyPreserveComparison;

        // 残り19以上では基本的に6を温存する。ただし最終遭遇や「6が余りそう」の
        // 目安に達した時は“6禁止を解除”するだけに留め、6を強制はしない。
        // 解除後は6を含む全候補をDPで比較する。
        const inS6PreserveZone = pdfStandardMode
          && normalNonChance
          && remainingGauge >= 19;
        const allowS6ByPdfException = inS6PreserveZone
          && countAvailable(s6)
          && (ce <= 1 || isS6Surplus(ce, s6, s5, s3));
        const preserveS6 = inS6PreserveZone && !allowS6ByPdfException;

        // PDF掲載表の開始条件に一致する時だけ、その表の初手を優先する。
        const pdfPreferredAi = mustFinishNow
          ? pdfStartPreferredAction(cg, cp, cChance, s6, s5, s4, s3, s1, ce)
          : -1;

        // 取り切りをハード制約にする状態だけ翌日送りを候補から外す。
        // 残り16〜18の温存比較と、6余り目安到達後は通常のDP比較に戻す。
        let bestEV = mustFinishNow ? -Infinity : passEV;
        let bestAction = mustFinishNow ? -3 : -2;
        const eatProb = cp >= ctx.guar ? 0.6 : 1.0;

        for (let ai = 0; ai < actions.length; ai++) {
          const a = actions[ai];
          let count;
          if (a.id === 's6') count = s6;
          else if (a.id === 's5') count = s5;
          else if (a.id === 's4') count = s4;
          else if (a.id === 's3') count = s3;
          else count = s1;
          if (count === 0) continue;

          let [ns6, ns5, ns4, ns3, ns1] = decrementForAction(a.id, s6, s5, s4, s3, s1);

          const np = Math.min(ctx.guar, cp + 1);

          if (preserveS6 && a.id === 's6') continue;

          if (mustFinishNow
              && !actionPreservesGuaranteedFinish(ai, cg, cp, cChance, s6, s5, s4, s3, s1)) {
            continue;
          }

          const evAfterEat = (ng) => {
            const clamped = Math.min(TARGET, ng);
            if (clamped >= TARGET) {
              return 1 + nextEncounterEV(0, ns6, ns5, ns3, ns1, ce);
            }
            return dp(clamped, np, 0, ns6, ns5, ns4, ns3, ns1, ce);
          };

          let eatEV;
          if (cChance && cp === 0) {
            eatEV = 0.10 * evAfterEat(TARGET)
                  + 0.90 * evAfterEat(cg + a.val * 3);
          } else {
            eatEV = 0.02 * evAfterEat(TARGET)
                  + 0.08 * evAfterEat(cg + a.val * 3)
                  + 0.90 * evAfterEat(cg + a.val);
          }

          // 食べなかった場合はサブレ非消費でその出会いだけ終了。
          const expectedValue = eatProb * eatEV + (1 - eatProb) * passEV;

          if (expectedValue > bestEV + EPS) {
            bestEV = expectedValue;
            bestAction = ai;
          } else if (Math.abs(expectedValue - bestEV) <= EPS) {
            // 残り16〜18の比較で期待値が同値なら、記事の「基本は捕まえ切り」に合わせて
            // 100%取り切りを維持する行動を優先する。それ以外はPDF表→小さい順で決める。
            const currentKeepsGuarantee = allowEarlyPreserveComparison
              && actionPreservesGuaranteedFinish(ai, cg, cp, cChance, s6, s5, s4, s3, s1);
            if (bestAction === -2) {
              if (currentKeepsGuarantee) {
                bestEV = expectedValue;
                bestAction = ai;
              }
            } else if (bestAction >= 0) {
              const bestKeepsGuarantee = allowEarlyPreserveComparison
                && actionPreservesGuaranteedFinish(bestAction, cg, cp, cChance, s6, s5, s4, s3, s1);
              const currentIsPdf = pdfPreferredAi >= 0 && ai === pdfPreferredAi;
              const bestIsPdf = pdfPreferredAi >= 0 && bestAction === pdfPreferredAi;
              let betterTie;
              if (currentKeepsGuarantee !== bestKeepsGuarantee) {
                // 16〜18の温存比較では、まず記事どおり100%取り切り維持を最優先。
                betterTie = currentKeepsGuarantee;
              } else {
                const bestA = actions[bestAction];
                // プレミアム時の「ボーナス+(4) vs スーパー(3)」だけは特別扱い。
                // イベント全体期待値と“この遭遇の捕獲確率”まで同値なら、
                // PDF表の初手指定より上位でボーナス+(4)を先に消化する。
                // これにより大成功時に有限のスーパー(3)等を温存しやすくする。
                const isPremiumBonusVsSuper = ctx.premium && (
                  (a.id === 's4' && bestA.id === 's3') ||
                  (a.id === 's3' && bestA.id === 's4')
                );
                let decidedByBonus4 = false;
                if (isPremiumBonusVsSuper) {
                  // mustFinishNow 中の候補は、どちらも「残り保証内で通常成功だけでも100%捕獲」を
                  // 維持する行動に既に限定済み。この場合は当該遭遇の捕獲率が双方100%なので、
                  // 高コストな捕獲率再帰を走らせず、そのままボーナス+(4)を優先できる。
                  if (mustFinishNow) {
                    betterTie = a.id === 's4';
                    decidedByBonus4 = true;
                  } else {
                    // 取り切りハード制約外では捕獲率が同じとは限らないため、従来どおり
                    // 当該遭遇の捕獲率まで同値の時だけボーナス+(4)を優先する。
                    const currentCatch = forcedActionCatchProb(ai, cg, cp, cChance, s6, s5, s4, s3, s1, ce);
                    const bestCatch = forcedActionCatchProb(bestAction, cg, cp, cChance, s6, s5, s4, s3, s1, ce);
                    if (Math.abs(currentCatch - bestCatch) <= 1e-12) {
                      betterTie = a.id === 's4';
                      decidedByBonus4 = true;
                    }
                  }
                }

                if (!decidedByBonus4) {
                  if (currentIsPdf !== bestIsPdf) {
                    betterTie = currentIsPdf;
                  } else {
                    // 通常の同値時はPDF表→小さい数字順。
                    betterTie = tieRank(a) < tieRank(bestA);
                  }
                }
              }
              if (betterTie) {
                bestEV = expectedValue;
                bestAction = ai;
              }
            }
          }
        }

        // mustFinishNow=true なら理論上必ず候補が1つ以上ある。万一入力の不整合等で
        // 候補が見つからなかった場合だけ安全側で従来の翌日送りへフォールバックする。
        if (bestAction === -3) {
          bestEV = passEV;
          bestAction = -2;
        }

        ctx.memo.set(key, bestEV, bestAction);
        return bestEV;
      }

      // 捕獲済み／満腹直後は、現在の出会いを終了済みとして「次回以降」だけの期待値を返す。
      // 残り出会い回数はUI上まだ現在回を含むため、ここで1回だけ減らす。
      const encounterEnded = !!input.encounterEnded || g >= TARGET;
      if (encounterEnded) {
        let futureEV = 0;
        if (enc > 1) {
          const carryG = g >= TARGET ? 0 : g;
          futureEV = 0.1 * dp(carryG, 0, 1, startInv.s6, startInv.s5, 1, startInv.s3, startInv.s1, enc - 1)
                   + 0.9 * dp(carryG, 0, 0, startInv.s6, startInv.s5, 1, startInv.s3, startInv.s1, enc - 1);
        }
        return {
          ev: futureEV,
          catchProb: 0,
          action: null,
          route: [],
          finalG: g,
          memoStates: ctx.memo.size,
          numericMemoKey: ctx.useNumericKey,
          encounterEnded: true
        };
      }

      const baseEV = dp(
        g, phase, chance ? 1 : 0,
        startInv.s6, startInv.s5, startInv.s4, startInv.s3, startInv.s1, enc
      );
      const baseAction = policyAction(
        g, phase, chance ? 1 : 0,
        startInv.s6, startInv.s5, startInv.s4, startInv.s3, startInv.s1, enc
      );

      // 「通常成功・満腹なし進行時」の表示用ルートもWorker内で作り、
      // 同じメモを使い回してメインスレッド側の再計算をゼロにする。
      const route = [];
      let rg = g;
      let rp = phase;
      let rChance = chance;
      let rs6 = startInv.s6, rs5 = startInv.s5, rs4 = startInv.s4, rs3 = startInv.s3, rs1 = startInv.s1;

      for (let guard = 0; rg < TARGET && guard < 40; guard++) {
        const ai = policyAction(rg, rp, rChance ? 1 : 0, rs6, rs5, rs4, rs3, rs1, enc);
        if (ai < 0) break;
        const a = actions[ai];
        route.push(a.name);

        if (a.id === 's6' && rs6 !== -1) rs6--;
        else if (a.id === 's5' && rs5 !== -1) rs5--;
        else if (a.id === 's4' && rs4 !== -1) rs4--;
        else if (a.id === 's3' && rs3 !== -1) rs3--;
        else if (a.id === 's1' && rs1 !== -1) rs1--;

        rg += a.val * (rChance ? 3 : 1);
        rp = Math.min(ctx.guar, rp + 1);
        rChance = false;
      }

      let action = null;
      if (baseAction >= 0) action = actions[baseAction];
      else if (baseAction === -2) action = { id: 'pass', val: 0, name: '➔ 翌日へ (ストップ)' };

      return {
        ev: baseEV,
        catchProb: policyCatchProb(g, phase, chance ? 1 : 0, startInv.s6, startInv.s5, startInv.s4, startInv.s3, startInv.s1, enc),
        action,
        route,
        finalG: rg,
        memoStates: ctx.memo.size,
        numericMemoKey: ctx.useNumericKey
      };
    }
  </script>
  <script>
  'use strict';
  (() => {
    const DEFAULT_INV = { s6:10, s5:10, s4:1, s3:0, s1:'∞', encounters:14 };
    const load = (key, fallback) => { try { const v=localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); } catch { return fallback; } };
    const save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };
    const clone = (v) => JSON.parse(JSON.stringify(v));

    const state = {
      inventory: load('mewtwo_inventory', DEFAULT_INV),
      formData: null,
      gauge: load('mewtwo_gauge', 0),
      isChance: load('mewtwo_isChance', false),
      fedCount: load('mewtwo_fedCount', 0),
      guaranteedCount: load('mewtwo_guaranteedCount', 3),
      isFull: load('mewtwo_isFull', false),
      history: load('mewtwo_history', []),
      isPremium: load('mewtwo_isPremium', true),
      engine: { isCalculating:false, bestMove:{type:'計算中...',id:null,prob:0}, expectedTotal:'計算中...', routeData:{route:[],finalG:0} }
    };
    state.formData = clone(state.inventory);

    const $ = (id) => document.getElementById(id);
    const els = Object.fromEntries(['gaugeInput','progressBar','resetGauge','chanceLabel','chanceToggle','guaranteeSelect','feedStatus','nextMove','detailCard','catchProb','route','resultArea','normalBtn','bigBtn','superBtn','fullBtn','fullMessage','passMessage','undoBtn','nextEncounterBtn','expectedTotal','expectBox','premiumToggle','premiumTrack','premiumLabel','inputList','applyWrap','applyBtn'].map(id=>[id,$(id)]));

    const ROWS = [
      {id:'s6', label:()=> 'ミュウツーサブレ (6)', inf:false},
      {id:'s5', label:()=> 'ハイパーサブレ (5)', inf:false},
      {id:'s4', label:()=> state.isPremium ? 'ボーナスサブレ+ (4)' : 'ボーナスサブレ (3)', inf:false, max:1},
      {id:'s3', label:()=> 'スーパーサブレ (3)', inf:true},
      {id:'s1', label:()=> 'ポケサブレ (1)', inf:true},
      {id:'encounters', label:()=> '残り出会い回数', inf:false}
    ];

    function buildRows() {
      els.inputList.innerHTML='';
      for (const row of ROWS) {
        const wrap=document.createElement('div'); wrap.className='input-row'; wrap.dataset.id=row.id;
        wrap.innerHTML=`<span class="input-label"></span><div class="input-controls"><div class="inf-slot">${row.inf?'<button class="inf-btn" type="button">∞</button>':''}</div><div class="stepper"><button class="step-btn down" type="button">−</button><input class="count-input" inputmode="numeric" min="0" ${row.max!==undefined?`max="${row.max}"`:''}><button class="step-btn up" type="button">＋</button></div></div>`;
        const input=wrap.querySelector('.count-input'); input.type='number';
        wrap.querySelector('.down').addEventListener('click',()=>stepRow(row,-1));
        wrap.querySelector('.up').addEventListener('click',()=>stepRow(row,1));
        input.addEventListener('input',()=>changeForm(row,input.value));
        if(row.inf) wrap.querySelector('.inf-btn').addEventListener('click',()=>changeForm(row,state.formData[row.id]==='∞'?'0':'∞'));
        els.inputList.appendChild(wrap);
      }
    }

    function changeForm(row, value) {
      if (value==='∞' && row.inf) state.formData[row.id]='∞';
      else if (value==='') state.formData[row.id]='';
      else {
        let n=parseInt(String(value).replace(/^0+(?=\d)/,''),10); if(!Number.isFinite(n)||n<0)n=0; if(row.max!==undefined)n=Math.min(row.max,n); state.formData[row.id]=n;
      }
      render();
    }
    function stepRow(row, delta) {
      const v=state.formData[row.id]; if(v==='∞') return;
      let n=v===''?0:(parseInt(v,10)||0); n=Math.max(0,n+delta); if(row.max!==undefined)n=Math.min(row.max,n); state.formData[row.id]=n; render();
    }
    function setStateKey(key,value,storageKey){ state[key]=value; if(storageKey) save(storageKey,value); }
    const actualGauge=()=> state.gauge===''?0:(Number(state.gauge)||0);
    const modified=()=> JSON.stringify(state.inventory)!==JSON.stringify(state.formData);

    let worker=null, workerUrl=null, requestId=0;
    function stopWorker(){ if(worker){worker.terminate();worker=null;} if(workerUrl){URL.revokeObjectURL(workerUrl);workerUrl=null;} }
    function recalc(){
      const rid=++requestId; stopWorker();
      const enc=Number(state.inventory.encounters)||0;
      if(enc<=0){ state.engine={isCalculating:false,bestMove:{type:'完了',id:null,prob:1},expectedTotal:'0.00',routeData:{route:[],finalG:actualGauge()}}; render(); return; }
      state.engine={...state.engine,isCalculating:true,bestMove:{type:'計算中...',id:null,prob:0}}; render();
      const source=$('solver-worker').textContent;
      workerUrl=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
      worker=new Worker(workerUrl);
      worker.onmessage=(e)=>{
        if(rid!==requestId)return; const data=e.data||{};
        if(data.type==='error'){ console.error(data.message||'Worker calculation error'); state.engine={isCalculating:false,bestMove:{type:'エラー',id:null,prob:0},expectedTotal:'0.00',routeData:{route:[],finalG:actualGauge()}}; stopWorker(); render(); return; }
        const r=data.result;
        let best;
        if(state.isFull) best={type:'満腹 (逃走)',id:null,prob:0};
        else if(actualGauge()>=30) best={type:'完了',id:null,prob:1};
        else best=r.action?{type:r.action.name,id:r.action.id,prob:r.catchProb}:{type:'➔ 翌日へ (ストップ)',id:'pass',prob:0};
        state.engine={isCalculating:false,bestMove:best,expectedTotal:Number(r.ev).toFixed(2),routeData:{route:r.route||[],finalG:r.finalG}};
        stopWorker(); render();
      };
      worker.onerror=(e)=>{ if(rid!==requestId)return; console.error(e.message||e); state.engine={isCalculating:false,bestMove:{type:'エラー',id:null,prob:0},expectedTotal:'0.00',routeData:{route:[],finalG:actualGauge()}}; stopWorker(); render(); };
      worker.postMessage({type:'solve',requestId:rid,premium:state.isPremium,guaranteedCount:Number(state.guaranteedCount)||3,state:{gauge:actualGauge(),fedCount:Number(state.fedCount)||0,chance:!!state.isChance,encounters:enc,inventory:state.inventory,encounterEnded:state.isFull||actualGauge()>=30}});
    }

    function renderRoute(){
      els.route.innerHTML=''; const arr=state.engine.routeData.route||[];
      arr.forEach((step,i)=>{ const s=document.createElement('span');s.className='route-step';s.textContent=step;els.route.appendChild(s); if(i<arr.length-1){const a=document.createElement('span');a.className='route-arrow';a.textContent='➔';els.route.appendChild(a);} });
      const end=document.createElement('span');
      if(state.engine.routeData.finalG>=30){end.className='route-get';end.textContent='GET!';} else {end.className='route-next';end.textContent='➔ 翌日へ';}
      els.route.appendChild(end);
    }

    function render(){
      const g=actualGauge(), calc=state.engine.isCalculating;
      els.gaugeInput.value=state.gauge;
      els.progressBar.style.width=`${Math.min(30,g)/30*100}%`;
      const chanceDisabled=state.fedCount>0||g>=30||state.isFull||calc;
      els.chanceToggle.checked=!!state.isChance; els.chanceToggle.disabled=chanceDisabled; els.chanceLabel.classList.toggle('disabled',chanceDisabled);
      els.guaranteeSelect.value=String(state.guaranteedCount); els.guaranteeSelect.disabled=state.isFull||calc;
      els.feedStatus.textContent=`現在 ${Number(state.fedCount)+1} 枚目（${state.fedCount>=state.guaranteedCount?'⚠️満腹リスクあり':'✅確定ライン'}）`;
      els.nextMove.textContent=state.isFull?'満腹 (逃走)':state.engine.bestMove.type; els.nextMove.classList.toggle('dim',calc);
      const actionable=!state.isFull&&state.engine.bestMove.type!=='完了'&&state.engine.bestMove.id&&state.engine.bestMove.id!=='pass';
      els.detailCard.hidden=!actionable; els.resultArea.hidden=!actionable;
      els.detailCard.classList.toggle('dim',calc); els.catchProb.textContent=`${(Number(state.engine.bestMove.prob)||0)*100>=0?((Number(state.engine.bestMove.prob)||0)*100).toFixed(1):'0.0'}%`; renderRoute();
      for(const b of [els.normalBtn,els.bigBtn,els.superBtn]){b.disabled=calc;b.classList.toggle('disabled',calc);b.classList.toggle('wait',calc);}
      const fullDisabled=calc||state.fedCount<state.guaranteedCount; els.fullBtn.disabled=fullDisabled; els.fullBtn.classList.toggle('disabled',fullDisabled); els.fullBtn.classList.toggle('wait',calc);
      els.fullMessage.hidden=!state.isFull; els.passMessage.hidden=state.isFull||state.engine.bestMove.id!=='pass';
      els.undoBtn.hidden=state.history.length===0; els.undoBtn.disabled=calc; els.undoBtn.classList.toggle('disabled',calc); els.undoBtn.classList.toggle('wait',calc);
      els.nextEncounterBtn.disabled=calc; els.nextEncounterBtn.classList.toggle('disabled',calc); els.nextEncounterBtn.classList.toggle('wait',calc);
      els.expectedTotal.textContent=state.engine.expectedTotal; els.expectBox.classList.toggle('dim',calc);
      els.premiumToggle.checked=!!state.isPremium; els.premiumToggle.disabled=calc; els.premiumTrack.classList.toggle('on',state.isPremium); els.premiumLabel.classList.toggle('on',state.isPremium);
      for(const row of ROWS){ const wrap=els.inputList.querySelector(`[data-id="${row.id}"]`); if(!wrap)continue; wrap.querySelector('.input-label').textContent=row.label(); const input=wrap.querySelector('.count-input'); const v=state.formData[row.id]; input.type=v==='∞'?'text':'number'; input.readOnly=v==='∞'; input.value=v==='∞'?'∞':v; const down=wrap.querySelector('.down'),up=wrap.querySelector('.up'); const n=v===''?0:(parseInt(v,10)||0); down.disabled=v==='∞'||n<=0; up.disabled=v==='∞'||(row.max!==undefined&&n>=row.max); }
      els.applyWrap.hidden=!modified(); els.applyBtn.disabled=calc; els.applyBtn.classList.toggle('disabled',calc); els.applyBtn.classList.toggle('wait',calc);
    }

    function pushHistory(){ state.history=[...state.history,{gauge:state.gauge,fedCount:state.fedCount,isChance:state.isChance,isFull:state.isFull,inventory:clone(state.inventory),formData:clone(state.formData)}]; save('mewtwo_history',state.history); }
    function handleThrow(multiplier){
      const id=state.engine.bestMove.id; if(!id||id==='pass'||state.engine.isCalculating)return; pushHistory();
      if(multiplier===0){ setStateKey('isFull',true,'mewtwo_isFull'); recalc(); return; }
      let m=multiplier; if(state.isChance&&multiplier===1)m=3;
      const val=id==='s6'?6:id==='s5'?5:id==='s4'?(state.isPremium?4:3):id==='s3'?3:1; const added=m===30?30:val*m;
      if(state.inventory[id]!=='∞'){ const next=Math.max(0,(Number(state.inventory[id])||0)-1); state.inventory={...state.inventory,[id]:next}; state.formData={...state.formData,[id]:next}; save('mewtwo_inventory',state.inventory); }
      setStateKey('gauge',Math.min(30,actualGauge()+added),'mewtwo_gauge'); setStateKey('fedCount',Number(state.fedCount)+1,'mewtwo_fedCount'); setStateKey('isChance',false,'mewtwo_isChance'); recalc();
    }
    function undo(){ if(!state.history.length)return; const last=state.history[state.history.length-1]; state.history=state.history.slice(0,-1); save('mewtwo_history',state.history); state.gauge=last.gauge;state.fedCount=last.fedCount;state.isChance=last.isChance;state.isFull=!!last.isFull;state.inventory=last.inventory;state.formData=last.formData; save('mewtwo_gauge',state.gauge);save('mewtwo_fedCount',state.fedCount);save('mewtwo_isChance',state.isChance);save('mewtwo_isFull',state.isFull);save('mewtwo_inventory',state.inventory);recalc(); }
    function nextEncounter(){ if(actualGauge()>=30){state.gauge=0;save('mewtwo_gauge',0);} state.fedCount=0;state.isChance=false;state.isFull=false;state.history=[]; save('mewtwo_fedCount',0);save('mewtwo_isChance',false);save('mewtwo_isFull',false);save('mewtwo_history',[]); const next={...state.inventory};let e=parseInt(next.encounters,10)||0;if(e>0)next.encounters=e-1;next.s4=1;state.inventory=next;state.formData=clone(next);save('mewtwo_inventory',next);recalc(); }

    buildRows();
    els.resetGauge.addEventListener('click',()=>{ if(confirm('フレンドポイントと食べた枚数を0にリセットしますか？')){state.gauge=0;state.fedCount=0;state.isChance=false;state.isFull=false;state.history=[];save('mewtwo_gauge',0);save('mewtwo_fedCount',0);save('mewtwo_isChance',false);save('mewtwo_isFull',false);save('mewtwo_history',[]);recalc();} });
    els.gaugeInput.addEventListener('input',e=>{const v=e.target.value;if(v==='')state.gauge='';else state.gauge=Math.min(30,Math.max(0,parseInt(v,10)||0));state.history=[];state.isFull=false;save('mewtwo_gauge',state.gauge);save('mewtwo_history',[]);save('mewtwo_isFull',false);recalc();});
    els.chanceToggle.addEventListener('change',e=>{state.isChance=e.target.checked;save('mewtwo_isChance',state.isChance);recalc();});
    els.guaranteeSelect.addEventListener('change',e=>{state.guaranteedCount=Number(e.target.value);save('mewtwo_guaranteedCount',state.guaranteedCount);recalc();});
    els.premiumToggle.addEventListener('change',e=>{state.isPremium=e.target.checked;save('mewtwo_isPremium',state.isPremium);render();recalc();});
    els.normalBtn.addEventListener('click',()=>handleThrow(1)); els.bigBtn.addEventListener('click',()=>handleThrow(3)); els.superBtn.addEventListener('click',()=>handleThrow(30)); els.fullBtn.addEventListener('click',()=>handleThrow(0));
    els.undoBtn.addEventListener('click',undo); els.nextEncounterBtn.addEventListener('click',nextEncounter);
    els.applyBtn.addEventListener('click',()=>{const clean={...state.formData};for(const k of ['s6','s5','s4','s3','s1','encounters'])if(clean[k]==='')clean[k]=0;state.inventory=clean;state.formData=clone(clean);save('mewtwo_inventory',clean);recalc();});
    window.addEventListener('beforeunload',stopWorker);
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((error) => {
          console.error('Service Worker registration failed:', error);
        });
      });
    }
    render(); recalc();
  })();
  </script>
</body>
